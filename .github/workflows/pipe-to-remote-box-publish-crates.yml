name: pipe-to-remote-box-publish-crates

# Publishes the crate from the exact source revision named by a stable GitHub
# Release. Authentication is crates.io trusted publishing (OIDC, no standing
# token secret), so this filename is part of the registry identity and must not
# be renamed after registration.

on:
  release:
    types: [published]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: pipe-to-remote-box-publish-crates
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io/guardian-intelligence/pipe-to-remote-box
  BUILD_IDENTITY: https://github.com/guardian-intelligence/guardian/.github/workflows/pipe-to-remote-box-image.yml@refs/heads/main
  ISSUER: https://token.actions.githubusercontent.com
  CRANE_VERSION: v0.21.7
  CRANE_SHA256: 1a57bc98207fa1c0d04bf760699099e26f8383499bfd55b99c1b919a928a7230

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'pipe-to-remote-box/v') && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: src/products/pipe-to-remote-box
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # Nothing from the release tag is executed until its commit is bound to
      # an OCI artifact signed by the main-only build identity. A holder of
      # Release write permission therefore cannot turn an arbitrary tag into
      # code execution in this OIDC-authorized job.
      - name: Bind the release tag to a signed main build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          curl -fsSLo crane.tar.gz "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  crane.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf crane.tar.gz -C "$HOME/.local/bin" crane
          rm crane.tar.gz

          body="$(gh release view "$TAG" --repo "${{ github.repository }}" \
            --json body --jq .body)"
          image="$(sed -n 's/^- Artifact: `\(ghcr\.io\/guardian-intelligence\/pipe-to-remote-box@sha256:[a-f0-9]\{64\}\)`$/\1/p' <<<"$body")"
          if [[ ! "$image" =~ ^${IMAGE_REPO}@sha256:[a-f0-9]{64}$ ]]; then
            echo "release $TAG names no unique digest-pinned $IMAGE_REPO artifact" >&2
            exit 1
          fi
          cosign verify --certificate-identity "$BUILD_IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" "$image" > /dev/null
          cosign verify-attestation --type spdxjson \
            --certificate-identity "$BUILD_IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" "$image" > /dev/null

          manifest="$($HOME/.local/bin/crane manifest "$image")"
          signed_revision="$(jq -r '.annotations["org.opencontainers.image.revision"] // empty' <<<"$manifest")"
          tag_revision="$(git rev-parse HEAD)"
          if [[ ! "$signed_revision" =~ ^[0-9a-f]{40}$ || "$tag_revision" != "$signed_revision" ]]; then
            echo "release tag $tag_revision is not the signed build revision $signed_revision" >&2
            exit 1
          fi
          echo "bound $TAG to signed main revision $signed_revision" >> "$GITHUB_STEP_SUMMARY"

      - name: Install the pinned Rust toolchain
        run: |
          channel="$(grep -o 'channel = "[0-9][0-9.]*"' rust-toolchain.toml \
            | grep -o '[0-9][0-9.]*')"
          rustup toolchain install "$channel" --profile minimal --no-self-update

      - name: Assert crate metadata matches the stable release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#pipe-to-remote-box/v}"
          meta="$(cargo metadata --no-deps --format-version 1)"
          manifest="$(jq -r '.packages[] | select(.name == "pipe-to-remote-box") | .version' <<<"$meta")"
          if [[ "$manifest" != "$version" ]]; then
            echo "release $TAG carries crate version $manifest, want $version" >&2
            exit 1
          fi
          if [[ "$(jq -r '.packages[] | select(.name == "pipe-to-remote-box") | .publish' <<<"$meta")" != "null" ]]; then
            echo "Cargo.toml disables crates.io publishing; complete the one-time name claim and trusted-publisher registration before enabling the lane" >&2
            exit 1
          fi
          reported="$(cargo run --locked --release --quiet -- --version)"
          if [[ "$reported" != "pipe-to-remote-box $version" ]]; then
            echo "release $TAG builds a binary reporting '$reported', want 'pipe-to-remote-box $version'" >&2
            exit 1
          fi
          cargo package --locked

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish crate with trusted publishing
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cargo publish --locked -p pipe-to-remote-box
          echo "published pipe-to-remote-box ${TAG#pipe-to-remote-box/v} to crates.io" >> "$GITHUB_STEP_SUMMARY"
