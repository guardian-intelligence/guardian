name: postflight-cli-publish-crates

# Publishes the `postflight` crate from the exact source commit a stable
# Release was cut from — crates.io is a source registry, so this is the one
# lane that ships something other than the signed release bytes. Auth is
# crates.io trusted publishing (OIDC, no token secrets), and the registry
# side of that trust names this file: renaming it revokes publish rights.

on:
  release:
    types: [published]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: postflight-cli-publish-crates
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'postflight-cli/v') && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: src/postflight/cli
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install the pinned toolchain
        run: |
          channel="$(grep -o 'channel = "[0-9][0-9.]*"' rust-toolchain.toml | grep -o '[0-9][0-9.]*')"
          rustup toolchain install "$channel" --profile minimal --no-self-update

      - name: Assert the crate is publishable and matches the release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#postflight-cli/v}"
          meta="$(cargo metadata --no-deps --format-version 1)"
          manifest="$(jq -r '.packages[0].version' <<<"$meta")"
          if [[ "$manifest" != "$version" ]]; then
            echo "release $TAG carries crate version $manifest — the version bump never landed" >&2
            exit 1
          fi
          # publish = false is the standing guard against publishing before the
          # crates.io name is claimed; cargo's own refusal names neither the key
          # nor the ceremony, so it is read here instead.
          if [[ "$(jq -r '.packages[0].publish' <<<"$meta")" != "null" ]]; then
            echo "Cargo.toml still carries publish = false: claim the crates.io name and" >&2
            echo "register the trusted publisher, then drop the key. See" >&2
            echo "docs/postflight-cli-distribution.md, the crates.io section." >&2
            exit 1
          fi

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish the crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cargo publish --locked -p postflight
          echo "published postflight ${TAG#postflight-cli/v} to crates.io" >> "$GITHUB_STEP_SUMMARY"
