name: build-and-test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Execution target (Postflight is an explicit migration canary)
        type: choice
        options:
          - github
          - postflight
        default: github

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: build-and-test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    # Keep the required PR gate and main's bootstrap builds available until
    # the end-to-end Turbo canary has passed. See docs/postflight-ci-migration.md.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'postflight' && 'postflight-4vcpu-ubuntu24-turbo' || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: github.event_name != 'workflow_dispatch' || inputs.runner != 'postflight'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out through the Postflight host mirror
        if: github.event_name == 'workflow_dispatch' && inputs.runner == 'postflight'
        uses: guardian-intelligence/guardian/actions/checkout@9297608734dcb700f0a3bf2bf302453813f5ed57
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Record Postflight execution and cache baseline
        if: github.event_name == 'workflow_dispatch' && inputs.runner == 'postflight'
        run: |
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test -n "$POSTFLIGHT_EXECUTION_ID"
          test -n "$POSTFLIGHT_ATTEMPT_ID"
          printf 'Postflight execution: %s, attempt: %s\n' "$POSTFLIGHT_EXECUTION_ID" "$POSTFLIGHT_ATTEMPT_ID"
          printf 'Guest boot ID: '
          cat /proc/sys/kernel/random/boot_id
          findmnt --target "$HOME" --output TARGET,SOURCE,FSTYPE,OPTIONS
          findmnt --target "$GITHUB_WORKSPACE" --output TARGET,SOURCE,FSTYPE,OPTIONS
          if [[ -d "$HOME/.cache/bazel-ci" ]]; then
            du -sk "$HOME/.cache/bazel-ci"
          else
            echo 'Bazel CI cache is cold'
          fi

      - name: Bootstrap toolchain
        run: scripts/bootstrap.sh

      - name: Restore Bazel cache
        if: github.event_name != 'workflow_dispatch' || inputs.runner != 'postflight'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-ci
          key: bazel-ci-${{ github.sha }}
          restore-keys: |
            bazel-ci-

      - name: Build
        # Temporary dispatch-only conformance probe; this branch is never merged.
        run: |
          sudo modprobe vsock_loopback
          python3 - <<'PYPROOF'
          import json
          import pathlib
          import platform
          print("POSTFLIGHT_VSOCK_MODULE_PROOF=" + json.dumps({"kernel": platform.release(), "vsock_loopback_loaded": pathlib.Path("/sys/module/vsock_loopback").is_dir()}, sort_keys=True))
          PYPROOF
          bazelisk test --config=ci --nocache_test_results --test_output=all --test_arg=-test.v //src/postflight/guestd:guestd_test //src/postflight/hostd/vm:vm_test //src/postflight/hostd/vsock:vsock_test
          echo POSTFLIGHT_FOCUSED_CONFORMANCE_PASSED
          exit 1

      - name: Test
        run: bazelisk test --config=ci //...

      - name: Verify tool pins fetch and unpack
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD |
            grep -qE '^(src/tools/|MODULE\.bazel)'; then
            bazelisk build //src/tools:pins
          else
            echo "no tool-pin paths in diff; skipping"
          fi

      - name: Save Bazel cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-ci
          key: bazel-ci-${{ github.sha }}
