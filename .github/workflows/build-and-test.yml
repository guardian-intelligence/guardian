name: build-and-test
run-name: Postflight listener maintenance drain

# Temporary operator probe branch. Never merge this workflow into main.
# A fresh dispatch consumes an existing one-use listener without a user step.
# Requires absent ACTIONS_STEP_DEBUG secrets/variables; never rerun with debug.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance-drain:
    runs-on: postflight-4vcpu-ubuntu24-turbo
    timeout-minutes: 5
    steps:
      - name: Maintenance drain (intentionally skipped)
        if: ${{ false }}
        run: 'true'
