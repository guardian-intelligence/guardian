name: build-and-test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: build-and-test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bootstrap toolchain
        run: scripts/bootstrap.sh

      - name: Restore Bazel cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-ci
          key: bazel-ci-${{ github.sha }}
          restore-keys: |
            bazel-ci-

      - name: Build
        run: bazelisk build --config=ci //...

      - name: Test
        run: bazelisk test --config=ci //...

      - name: Verify tool pins fetch and unpack
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD |
            grep -qE '^(src/tools/|MODULE\.bazel)'; then
            bazelisk build //src/tools:pins
          else
            echo "no tool-pin paths in diff; skipping"
          fi

      - name: Save Bazel cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-ci
          key: bazel-ci-${{ github.sha }}
