name: pipe-to-remote-box-image

# Main-only build identity for Pipe to Remote Box. All four release targets are
# cross-compiled from one reviewed revision, structurally checked, and signed
# keylessly before a single OCI artifact is published. The artifact also gets
# its own signature and SPDX SBOM attestation. Promotion reuses these bytes and
# bundles unchanged.

on:
  push:
    branches: [main]
    paths:
      - "src/products/pipe-to-remote-box/**"
      - "!src/products/pipe-to-remote-box/release/**"
      - ".github/workflows/pipe-to-remote-box-image.yml"
      - "go.mod"
      - "go.sum"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - ".bazelrc"
      - ".bazelversion"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: pipe-to-remote-box-image
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io/guardian-intelligence/pipe-to-remote-box
  BUILD_IDENTITY: https://github.com/guardian-intelligence/guardian/.github/workflows/pipe-to-remote-box-image.yml@refs/heads/main
  ISSUER: https://token.actions.githubusercontent.com
  TARGETS: x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin
  ZIG_VERSION: 0.15.2
  ZIG_SHA256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
  CARGO_ZIGBUILD_VERSION: v0.23.0
  CARGO_ZIGBUILD_SHA256: f0aa9cc8220a84788c6e4a9b6d80422f041659227b680fdef982d5a8ddffddb4
  CRANE_VERSION: v0.21.7
  CRANE_SHA256: 1a57bc98207fa1c0d04bf760699099e26f8383499bfd55b99c1b919a928a7230

jobs:
  edge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2 # v3.0.0

      - name: Install pinned build and registry tools
        run: |
          curl -fsSLo zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/.local/zig"
          tar -xJf zig.tar.xz -C "$HOME/.local/zig" --strip-components=1
          echo "$HOME/.local/zig" >> "$GITHUB_PATH"

          curl -fsSLo cargo-zigbuild.tar.xz "https://github.com/rust-cross/cargo-zigbuild/releases/download/${CARGO_ZIGBUILD_VERSION}/cargo-zigbuild-x86_64-unknown-linux-musl.tar.xz"
          echo "${CARGO_ZIGBUILD_SHA256}  cargo-zigbuild.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xJf cargo-zigbuild.tar.xz -C "$HOME/.local/bin" --strip-components=1 \
            cargo-zigbuild-x86_64-unknown-linux-musl/cargo-zigbuild

          curl -fsSLo crane.tar.gz "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  crane.tar.gz" | sha256sum -c -
          tar -xzf crane.tar.gz -C "$HOME/.local/bin" crane
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm zig.tar.xz cargo-zigbuild.tar.xz crane.tar.gz

      - name: Build every release target
        working-directory: src/products/pipe-to-remote-box
        run: |
          rustup toolchain install
          export RUSTFLAGS="--remap-path-prefix=$PWD=/build --remap-path-prefix=$HOME/.cargo=/cargo"
          for target in $TARGETS; do
            cargo zigbuild --release --locked --target "$target"
          done

      - name: Build the controlled loopback SSH canary fixture
        run: |
          bazelisk build --config=ci //src/products/pipe-to-remote-box/canary/sshd:sshd
          fixture="$(bazelisk cquery --config=ci --output=files \
            //src/products/pipe-to-remote-box/canary/sshd:sshd)"
          [[ -x "$fixture" ]] || { echo "Bazel produced no SSH canary fixture" >&2; exit 1; }
          install -D -m 0755 "$fixture" \
            src/products/pipe-to-remote-box/target/canary/sshd
          file src/products/pipe-to-remote-box/target/canary/sshd \
            | grep -q 'ELF 64-bit LSB.*x86-64'

      - name: Smoke-test built artifacts
        working-directory: src/products/pipe-to-remote-box
        run: |
          native=x86_64-unknown-linux-musl
          crate_version="$(awk -F'"' '
            /^\[/ { package = ($0 == "[package]") }
            package && /^version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)"
          [[ -n "$crate_version" ]] \
            || { echo "::error::Cargo.toml [package] names no version"; exit 1; }

          failed=0
          reject() {
            echo "::error::smoke $1 $2: ${3//$'\n'/%0A}"
            failed=1
          }
          field() {
            od -An -tx1 -N"$2" -j"$3" "$1" | tr -d ' \n'
          }

          for target in $TARGETS; do
            case "$target" in
              x86_64-unknown-linux-musl)  magic=7f454c46; arch=3e00; at=18; len=2 ;;
              aarch64-unknown-linux-musl) magic=7f454c46; arch=b700; at=18; len=2 ;;
              x86_64-apple-darwin)        magic=cffaedfe; arch=07000001; at=4; len=4 ;;
              aarch64-apple-darwin)       magic=cffaedfe; arch=0c000001; at=4; len=4 ;;
              *)
                reject "$target" structure "no object shape is declared"
                continue
                ;;
            esac
            binary="target/$target/release/pipe-to-remote-box"
            if [[ ! -s "$binary" ]]; then
              reject "$target" built "nothing at $binary"
              continue
            fi
            got_magic="$(field "$binary" 4 0)"
            [[ "$got_magic" == "$magic" ]] \
              || reject "$target" magic "want $magic, got $got_magic"
            got_arch="$(field "$binary" "$len" "$at")"
            [[ "$got_arch" == "$arch" ]] \
              || reject "$target" architecture "want $arch, got $got_arch"
          done

          native_binary="target/$native/release/pipe-to-remote-box"
          if [[ -x "$native_binary" ]]; then
            if version_out="$(timeout 30 "$native_binary" --version 2>&1)"; then
              [[ "$version_out" == "pipe-to-remote-box $crate_version" ]] \
                || reject "$native" version \
                  "reported '$version_out', want 'pipe-to-remote-box $crate_version'"
            else
              reject "$native" version "exited nonzero: $version_out"
            fi
          else
            reject "$native" built "nothing executable at $native_binary"
          fi

          [[ "$failed" -eq 0 ]] || exit 1
          echo "smoke passed for Pipe to Remote Box $crate_version on every target" >> "$GITHUB_STEP_SUMMARY"

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Compare built bytes with the current edge
        id: dedup
        working-directory: src/products/pipe-to-remote-box
        run: |
          binaries_digest="$(for target in $TARGETS; do
            sha256sum "target/$target/release/pipe-to-remote-box" | cut -d' ' -f1
          done | sha256sum | cut -d' ' -f1)"
          fixture_digest="$(sha256sum target/canary/sshd | cut -d' ' -f1)"
          probe_digest="$(sha256sum src/remote_probe.sh | cut -d' ' -f1)"
          notices_digest="$(sha256sum THIRD_PARTY_LICENSES.md | cut -d' ' -f1)"
          license_digest="$(sha256sum LICENSE | cut -d' ' -f1)"
          echo "binaries_digest=$binaries_digest" >> "$GITHUB_OUTPUT"
          echo "fixture_digest=$fixture_digest" >> "$GITHUB_OUTPUT"
          echo "probe_digest=$probe_digest" >> "$GITHUB_OUTPUT"
          echo "notices_digest=$notices_digest" >> "$GITHUB_OUTPUT"
          echo "license_digest=$license_digest" >> "$GITHUB_OUTPUT"

          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          current_manifest="$(crane manifest "$IMAGE_REPO:edge" 2>/dev/null || true)"
          current_binaries="$(jq -r '.annotations["org.guardian.binaries-digest"] // empty' <<<"$current_manifest" 2>/dev/null || true)"
          current_fixture="$(jq -r '.annotations["org.guardian.canary-fixture-digest"] // empty' <<<"$current_manifest" 2>/dev/null || true)"
          current_probe="$(jq -r '.annotations["org.guardian.remote-probe-digest"] // empty' <<<"$current_manifest" 2>/dev/null || true)"
          current_notices="$(jq -r '.annotations["org.guardian.canary-notices-digest"] // empty' <<<"$current_manifest" 2>/dev/null || true)"
          current_license="$(jq -r '.annotations["org.guardian.license-digest"] // empty' <<<"$current_manifest" 2>/dev/null || true)"
          trusted=false
          if [[ -n "$current_binaries" && "$current_binaries" == "$binaries_digest" \
            && -n "$current_fixture" && "$current_fixture" == "$fixture_digest" \
            && -n "$current_probe" && "$current_probe" == "$probe_digest" \
            && -n "$current_notices" && "$current_notices" == "$notices_digest" \
            && -n "$current_license" && "$current_license" == "$license_digest" ]]; then
            verify_dir="$(mktemp -d)"
            if cosign verify --certificate-identity "$BUILD_IDENTITY" \
                --certificate-oidc-issuer "$ISSUER" "$IMAGE_REPO:edge" > /dev/null 2>&1 \
              && cosign verify-attestation --type spdxjson \
                --certificate-identity "$BUILD_IDENTITY" \
                --certificate-oidc-issuer "$ISSUER" "$IMAGE_REPO:edge" > /dev/null 2>&1 \
              && crane export "$IMAGE_REPO:edge" - | tar -x -C "$verify_dir"; then
              expected="$(
                for target in $TARGETS; do
                  printf '%s\n' "$target/pipe-to-remote-box" \
                    "$target/pipe-to-remote-box.sigstore.json"
                done
                printf '%s\n' 'LICENSE' '_canary/sshd' '_canary/THIRD_PARTY_LICENSES.md'
              )"
              actual="$(cd "$verify_dir" && find . -type f | sed 's#^\./##' | sort)"
              if [[ "$actual" == "$(sort <<<"$expected")" ]]; then
                trusted=true
                for target in $TARGETS; do
                  cmp "target/$target/release/pipe-to-remote-box" \
                    "$verify_dir/$target/pipe-to-remote-box" || trusted=false
                  cosign verify-blob \
                    --bundle "$verify_dir/$target/pipe-to-remote-box.sigstore.json" \
                    --certificate-identity "$BUILD_IDENTITY" \
                    --certificate-oidc-issuer "$ISSUER" \
                    "$verify_dir/$target/pipe-to-remote-box" > /dev/null 2>&1 \
                    || trusted=false
                done
                cmp target/canary/sshd "$verify_dir/_canary/sshd" || trusted=false
                cmp THIRD_PARTY_LICENSES.md \
                  "$verify_dir/_canary/THIRD_PARTY_LICENSES.md" || trusted=false
                cmp LICENSE "$verify_dir/LICENSE" || trusted=false
              fi
            fi
          fi
          if [[ "$trusted" == true ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "edge already holds the fully verified payload; nothing to push" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "binaries $binaries_digest, fixture $fixture_digest; pushing a new edge artifact" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sign each binary
        if: steps.dedup.outputs.changed == 'true'
        working-directory: src/products/pipe-to-remote-box
        run: |
          mkdir -p stage
          for target in $TARGETS; do
            mkdir -p "stage/$target"
            cp "target/$target/release/pipe-to-remote-box" \
              "stage/$target/pipe-to-remote-box"
            cosign sign-blob --yes \
              --bundle "stage/$target/pipe-to-remote-box.sigstore.json" \
              "stage/$target/pipe-to-remote-box"
          done
          mkdir -p stage/_canary
          cp target/canary/sshd stage/_canary/sshd
          cp THIRD_PARTY_LICENSES.md stage/_canary/THIRD_PARTY_LICENSES.md
          cp LICENSE stage/LICENSE
          echo "${{ steps.dedup.outputs.fixture_digest }}  stage/_canary/sshd" \
            | sha256sum -c -

      - name: Push the edge artifact
        if: steps.dedup.outputs.changed == 'true'
        id: push
        working-directory: src/products/pipe-to-remote-box
        run: |
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='@0' \
            -cf layer.tar -C stage .
          crane append -f layer.tar -t "$IMAGE_REPO:sha-${GITHUB_SHA}"
          candidate="$IMAGE_REPO:build-${GITHUB_SHA}"
          crane mutate \
            --annotation "org.opencontainers.image.source=https://github.com/guardian-intelligence/guardian" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.guardian.binaries-digest=${{ steps.dedup.outputs.binaries_digest }}" \
            --annotation "org.guardian.canary-fixture-digest=${{ steps.dedup.outputs.fixture_digest }}" \
            --annotation "org.guardian.remote-probe-digest=${{ steps.dedup.outputs.probe_digest }}" \
            --annotation "org.guardian.canary-notices-digest=${{ steps.dedup.outputs.notices_digest }}" \
            --annotation "org.guardian.license-digest=${{ steps.dedup.outputs.license_digest }}" \
            --tag "$candidate" \
            "$IMAGE_REPO:sha-${GITHUB_SHA}"
          digest="$(crane digest "$candidate")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "pushed immutable candidate $candidate at $digest" >> "$GITHUB_STEP_SUMMARY"

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        if: steps.dedup.outputs.changed == 'true'
        id: syft

      - name: Sign the artifact and attest its SBOM
        if: steps.dedup.outputs.changed == 'true'
        working-directory: src/products/pipe-to-remote-box
        run: |
          image="$IMAGE_REPO@${{ steps.push.outputs.digest }}"
          mkdir -p sbom-input
          cp Cargo.toml Cargo.lock LICENSE sbom-input/
          crypto_version="$(awk '$1 == "golang.org/x/crypto" { print $2; exit }' "$GITHUB_WORKSPACE/go.mod")"
          sys_version="$(awk '$1 == "golang.org/x/sys" { print $2; exit }' "$GITHUB_WORKSPACE/go.mod")"
          go_version="$(awk '$1 == "go" { print $2; exit }' "$GITHUB_WORKSPACE/go.mod")"
          [[ "$crypto_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ \
            && "$sys_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ \
            && "$go_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cat > sbom-input/go.mod <<EOF
          module pipe-to-remote-box-canary-fixture

          go $go_version

          require (
            golang.org/x/crypto $crypto_version
            golang.org/x/sys $sys_version
          )
          EOF
          grep -E '^golang.org/x/(crypto|sys) ' "$GITHUB_WORKSPACE/go.sum" \
            > sbom-input/go.sum
          "${{ steps.syft.outputs.cmd }}" scan dir:sbom-input \
            -o spdx-json=pipe-to-remote-box.spdx.json
          test -s pipe-to-remote-box.spdx.json
          jq -e --arg version "$crypto_version" \
            '.packages[] | select(.name == "golang.org/x/crypto" and .versionInfo == $version)' \
            pipe-to-remote-box.spdx.json > /dev/null
          jq -e --arg version "$sys_version" \
            '.packages[] | select(.name == "golang.org/x/sys" and .versionInfo == $version)' \
            pipe-to-remote-box.spdx.json > /dev/null
          cosign sign --yes "$image"
          cosign attest --yes --type spdxjson \
            --predicate pipe-to-remote-box.spdx.json "$image"

      - name: Verify the complete consumer chain
        if: steps.dedup.outputs.changed == 'true'
        working-directory: src/products/pipe-to-remote-box
        env:
          IDENTITY: https://github.com/guardian-intelligence/guardian/.github/workflows/pipe-to-remote-box-image.yml@refs/heads/main
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          image="$IMAGE_REPO@${{ steps.push.outputs.digest }}"
          cosign verify --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" "$image" > /dev/null
          cosign verify-attestation --type spdxjson \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" "$image" > /dev/null
          for target in $TARGETS; do
            cosign verify-blob \
              --bundle "stage/$target/pipe-to-remote-box.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" \
              "stage/$target/pipe-to-remote-box"
          done
          manifest="$(crane manifest "$image")"
          [[ "$(jq -r '.annotations["org.guardian.canary-fixture-digest"]' <<<"$manifest")" \
            == "${{ steps.dedup.outputs.fixture_digest }}" ]]
          [[ "$(jq -r '.annotations["org.guardian.remote-probe-digest"]' <<<"$manifest")" \
            == "${{ steps.dedup.outputs.probe_digest }}" ]]
          [[ "$(jq -r '.annotations["org.guardian.canary-notices-digest"]' <<<"$manifest")" \
            == "${{ steps.dedup.outputs.notices_digest }}" ]]
          [[ "$(jq -r '.annotations["org.guardian.license-digest"]' <<<"$manifest")" \
            == "${{ steps.dedup.outputs.license_digest }}" ]]
          export_dir="$(mktemp -d)"
          crane export "$image" - | tar -x -C "$export_dir"
          echo "${{ steps.dedup.outputs.fixture_digest }}  $export_dir/_canary/sshd" \
            | sha256sum -c -
          cmp stage/_canary/THIRD_PARTY_LICENSES.md \
            "$export_dir/_canary/THIRD_PARTY_LICENSES.md"
          echo "${{ steps.dedup.outputs.notices_digest }}  $export_dir/_canary/THIRD_PARTY_LICENSES.md" \
            | sha256sum -c -
          cmp stage/LICENSE "$export_dir/LICENSE"
          echo "${{ steps.dedup.outputs.license_digest }}  $export_dir/LICENSE" \
            | sha256sum -c -

      - name: Advance edge only after complete verification
        if: steps.dedup.outputs.changed == 'true'
        run: |
          image="$IMAGE_REPO@${{ steps.push.outputs.digest }}"
          crane tag "$image" edge
          [[ "$(crane digest "$IMAGE_REPO:edge")" == "${{ steps.push.outputs.digest }}" ]]
          cosign verify --certificate-identity "$BUILD_IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" "$IMAGE_REPO:edge" > /dev/null
          cosign verify-attestation --type spdxjson \
            --certificate-identity "$BUILD_IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" "$IMAGE_REPO:edge" > /dev/null
          echo "advanced $IMAGE_REPO:edge after complete verification" >> "$GITHUB_STEP_SUMMARY"
