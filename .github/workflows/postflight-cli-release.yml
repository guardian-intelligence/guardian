name: postflight-cli-release

# Release cutter for the postflight CLI: fires on a channel-pin merge commit
# (the Kargo promotion PR advancing release/channels.yaml for nightly, a human
# PR for rc/stable), verifies the full signature chain of every pinned artifact
# that has no release yet, and publishes a GitHub Release with the binaries,
# the cosign bundles minted at build time, and a source tarball cut at the
# build commit — nothing is re-signed here. Releases are cut with a short-lived
# guardian-promotions App token (the same identity that opens promotion PRs),
# minted only after the dedup check: unlike GITHUB_TOKEN, App-authored releases
# fire `release:` workflows, which stable's npm publish will ride. A stable cut
# also renders the Homebrew formula from the checksums of the assets it just
# published and mirrors it to the tap.

on:
  push:
    branches: [main]
    paths:
      - "src/products/postflight-cli/release/channels.yaml"
      - ".github/workflows/postflight-cli-release.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: postflight-cli-release
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io/guardian-intelligence/postflight-cli
  CHANNELS: nightly rc stable
  CHANNELS_FILE: src/products/postflight-cli/release/channels.yaml
  TARGETS: x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin
  NATIVE_TARGET: x86_64-unknown-linux-musl
  BUILD_IDENTITY: https://github.com/guardian-intelligence/guardian/.github/workflows/postflight-cli-image.yml@refs/heads/main
  RELEASE_IDENTITY: https://github.com/guardian-intelligence/guardian/.github/workflows/postflight-cli-release.yml@refs/heads/main
  ISSUER: https://token.actions.githubusercontent.com
  # How recently a release candidate must have been published to still count as
  # the soak a stable cut descends from.
  RC_SOAK_DAYS: 7
  CRANE_VERSION: v0.21.7
  CRANE_SHA256: 1a57bc98207fa1c0d04bf760699099e26f8383499bfd55b99c1b919a928a7230

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The installer is the one asset signed here rather than at build time:
      # it is a source file, not a build output, and it tracks main rather than
      # the commit that produced the binaries.
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Plan the channel cuts
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # rc and stable pins arrive by hand-authored PR, so the pins are read
          # with a real parser: a trailing comment or a typo'd channel key must
          # fail the cut, not silently resolve to "no pin".
          python3 - > pins.txt <<'PY'
          import os
          import sys

          import yaml


          def fail(message):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(message + "\n")
              sys.exit(message)


          known = os.environ["CHANNELS"].split()
          document = yaml.safe_load(open(os.environ["CHANNELS_FILE"])) or {}
          channels = document.get("channels") or {}
          unknown = sorted(set(channels) - set(known))
          if unknown:
              fail("channels.yaml declares unknown channel(s): " + " ".join(unknown))
          for name in known:
              pin = channels.get(name) or {}
              if not isinstance(pin, dict):
                  fail(f"channels.{name} is not a mapping")
              print(name, pin.get("image", ""), pin.get("version", ""))
          PY

          # Every dedup and lineage question is "what has this channel already
          # released", and the tag grammar partitions the release space:
          # `nightly-`, `rc-` and `v` are a channel each. One tag in the
          # listing, `postflight-cli/v0.2.0-rc.1`, is spelled in the grammar
          # that preceded `rc-`, so the rc set admits that shape as well and
          # the stable set refuses it — the same two rules the installer and
          # the install canary carry, held to this file by
          # TestPostflightCliChannelGrammarMovesTogether.
          #
          # Bodies ride along because they carry the digest a dedup greps for
          # and the source commit a stable's lineage walks; @tsv keeps a
          # multi-line body on one row. The cache path comes back in a variable
          # rather than on stdout because bash suppresses `set -e` inside the
          # command substitution of an assignment, which would turn a failed
          # listing into an empty file and a duplicate cut.
          releases() {
            RELEASES="releases-$1.tsv"
            local match
            case "$1" in
              nightly) match='startswith("postflight-cli/nightly-")' ;;
              rc) match='startswith("postflight-cli/rc-") or (startswith("postflight-cli/v") and contains("-rc."))' ;;
              stable) match='startswith("postflight-cli/v") and (contains("-rc.") | not)' ;;
              *)
                echo "no release tag grammar for channel $1" >> "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
            esac
            if [[ ! -f "$RELEASES" ]]; then
              gh api "repos/${{ github.repository }}/releases" --paginate \
                --jq ".[] | select(.tag_name | $match)
                  | [.tag_name, .published_at, (.body // \"\")] | @tsv" \
                > "$RELEASES.part"
              mv "$RELEASES.part" "$RELEASES"
            fi
          }

          cuts=()
          : > plan.txt
          while read -r channel image version <&3; do
            image="$(grep -o "$IMAGE_REPO@sha256:[a-f0-9]\{64\}" <<<"$image" || true)"
            if [[ -z "$image" ]]; then
              echo "$channel: no pin — nothing to release" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            digest="${image##*@}"

            releases "$channel"
            if grep -q "$digest" "$RELEASES"; then
              echo "$channel: $digest is already released — skipping" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            case "$channel" in
              rc)
                if [[ -z "$version" ]]; then
                  echo "$channel: the pin claims no version, so nothing holds the bytes to it" >> "$GITHUB_STEP_SUMMARY"
                  exit 1
                fi
                # rc promotes nightly's exact bytes, so its lineage is the digest.
                releases nightly
                if ! grep -q "$digest" "$RELEASES"; then
                  echo "$channel: $digest was never released on nightly — lineage broken, refusing to cut" >> "$GITHUB_STEP_SUMMARY"
                  exit 1
                fi
                ;;
              stable)
                if [[ -z "$version" || "$version" == *-* ]]; then
                  echo "$channel: version '$version' is not a stable version" >> "$GITHUB_STEP_SUMMARY"
                  exit 1
                fi
                # A stable cut drops the prerelease suffix, which changes
                # CARGO_PKG_VERSION, hence the bytes, hence the digest: stable
                # can never share a digest with the candidate it promotes, so
                # its lineage cannot be a digest match. What stays checkable is
                # that a candidate published inside the soak window was built
                # from a commit this build descends from; the ancestry half is
                # asserted once the revision is known, against every candidate
                # still in the window.
                releases rc
                cutoff=$(( $(date -u +%s) - RC_SOAK_DAYS * 86400 ))
                : > "lineage-$channel.rev"
                while IFS=$'\t' read -r tag published body <&4; do
                  # A draft candidate has no publication date and has soaked
                  # nowhere; it cannot be what a stable descends from.
                  [[ -n "$published" ]] || continue
                  (( $(date -u -d "$published" +%s) >= cutoff )) || continue
                  source_commit="$(sed -n 's/.*Source commit: \([0-9a-f]\{40\}\).*/\1/p' <<<"$body")"
                  [[ -n "$source_commit" ]] || continue
                  printf '%s %s\n' "$tag" "$source_commit" >> "lineage-$channel.rev"
                done 4< "$RELEASES"
                if [[ ! -s "lineage-$channel.rev" ]]; then
                  echo "$channel: no release candidate published in the last $RC_SOAK_DAYS days — nothing soaked, refusing to cut" >> "$GITHUB_STEP_SUMMARY"
                  exit 1
                fi
                ;;
            esac

            cuts+=("$channel")
            printf '%s %s %s\n' "$channel" "$image" "$version" >> plan.txt
          done 3< pins.txt
          echo "cuts=${cuts[*]}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        if: steps.plan.outputs.cuts != ''

      - name: Verify the artifacts before publishing
        if: steps.plan.outputs.cuts != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSLo crane.tar.gz "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  crane.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf crane.tar.gz -C "$HOME/.local/bin" crane
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"

          mkdir -p meta
          while read -r channel image version <&3; do
            cosign verify --certificate-identity "$BUILD_IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" "$image" > /dev/null

            manifest="$(crane manifest "$image")"
            revision="$(jq -r '.annotations["org.opencontainers.image.revision"]' <<<"$manifest")"
            binaries_digest="$(jq -r '.annotations["org.guardian.binaries-digest"]' <<<"$manifest")"

            if [[ -f "lineage-$channel.rev" ]]; then
              soaked=
              while read -r tag base <&4; do
                # A candidate built from a commit the repository no longer has
                # answers nothing; the next candidate still can, and a window
                # in which none of them answers fails below.
                if status="$(gh api "repos/${{ github.repository }}/compare/$base...$revision" \
                    --jq .status 2>/dev/null)"; then
                  case "$status" in
                    ahead | identical) soaked="$tag"; break ;;
                  esac
                fi
              done 4< "lineage-$channel.rev"
              if [[ -z "$soaked" ]]; then
                echo "$channel: build commit $revision descends from no candidate published in the last $RC_SOAK_DAYS days ($(cut -d' ' -f1 "lineage-$channel.rev" | tr '\n' ' '))" >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              echo "$channel: soaked as $soaked" >> "$GITHUB_STEP_SUMMARY"
            fi

            mkdir -p "stage/$channel" "work/$channel" "assets/$channel"
            crane export "$image" - | tar -x -C "stage/$channel"
            for target in $TARGETS; do
              cp "stage/$channel/$target/postflight" "assets/$channel/postflight-$target"
              cp "stage/$channel/$target/postflight.sigstore.json" "assets/$channel/postflight-$target.sigstore.json"
              cosign verify-blob \
                --bundle "assets/$channel/postflight-$target.sigstore.json" \
                --certificate-identity "$BUILD_IDENTITY" \
                --certificate-oidc-issuer "$ISSUER" \
                "assets/$channel/postflight-$target"
            done

            # First line only: `version` prints provenance underneath itself
            # when an install receipt sits beside the binary. `--short` would
            # read better and is not usable here — a stable cut can ride
            # freight built before that flag existed.
            built="$("assets/$channel/postflight-$NATIVE_TARGET" version | head -n 1)"
            built="${built#postflight version }"
            if [[ -n "$version" && "$built" != "$version" ]]; then
              echo "$channel: pin claims $version but the artifact is $built" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            # The checkout is shallow at the pin commit; the sources that
            # produced these binaries live at the build commit.
            git fetch --depth 1 origin "$revision"
            prefix="postflight-$built-src"
            tarball="assets/$channel/$prefix.tar.gz"
            git archive --format=tar --prefix="$prefix/" \
              -o "work/$channel/src.tar" "$revision:src/products/postflight-cli"
            git archive --format=tar --prefix="$prefix/" \
              -o "work/$channel/license.tar" "$revision" LICENSE.md
            tar -Af "work/$channel/src.tar" "work/$channel/license.tar"
            gzip -n -c "work/$channel/src.tar" > "$tarball"

            contents="$(tar tzf "$tarball")"
            if ! grep -qxF "$prefix/LICENSE.md" <<<"$contents"; then
              echo "$channel: source tarball carries no license" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            sources_make=0
            if grep -qxF "$prefix/Makefile" <<<"$contents"; then
              sources_make=1
            fi

            # Shipping the installer with the release closes the chain the
            # website cannot: a caller who trusts nothing but this repository's
            # signing identity can fetch it, verify it, and run it.
            cp src/products/postflight-cli/dist/install.sh "assets/$channel/install.sh"
            cosign sign-blob --yes \
              --bundle "assets/$channel/install.sh.sigstore.json" \
              "assets/$channel/install.sh"
            cosign verify-blob \
              --bundle "assets/$channel/install.sh.sigstore.json" \
              --certificate-identity "$RELEASE_IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" \
              "assets/$channel/install.sh"

            (cd "assets/$channel" && sha256sum postflight-* install.sh* > checksums.txt)
            printf 'revision=%s\nbinaries_digest=%s\nversion=%s\nsources_make=%s\n' \
              "$revision" "$binaries_digest" "$built" "$sources_make" > "meta/$channel.env"
          done 3< plan.txt

      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        if: steps.plan.outputs.cuts != ''
        id: app
        with:
          app-id: ${{ secrets.PROMOTIONS_APP_ID }}
          private-key: ${{ secrets.PROMOTIONS_APP_PRIVATE_KEY }}

      # An installation token carries only the repositories it was minted for,
      # so the tap write needs one of its own — the token above 404s on it.
      # Minted before the cut so a tap that is unreachable fails the release
      # rather than stranding it half-published.
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        if: contains(steps.plan.outputs.cuts, 'stable')
        id: tap
        with:
          app-id: ${{ secrets.PROMOTIONS_APP_ID }}
          private-key: ${{ secrets.PROMOTIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap

      - name: Cut the releases
        if: steps.plan.outputs.cuts != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # On 404 gh api prints the error JSON to stdout and --jq never
          # applies — only the exit code distinguishes a missing tag, so an
          # unguarded $(...) capture reads garbage into the variable.
          tag_sha() {
            local out
            if out="$(gh api "repos/${{ github.repository }}/git/ref/tags/$1" \
                --jq .object.sha 2>/dev/null)"; then
              printf '%s' "$out"
            fi
          }

          # The plan rides its own descriptor: the loop body shells out, and a
          # child that reads stdin would eat the remaining channels.
          while read -r channel image _ <&3; do
            . "meta/$channel.env"
            case "$channel" in
              nightly)
                day="$(date -u +%Y%m%d -d "@$(git log -1 --format=%ct)")"
                tag="postflight-cli/nightly-$day"
                title="postflight CLI nightly $day"
                flags=(--prerelease)
                summary="Automated nightly release of the postflight CLI."
                ;;
              rc)
                # A candidate is a pointer at bytes that already shipped on
                # nightly, so it is named for the day it was promoted: the
                # version it reports is the one main carries, and several
                # candidates wear it before a stable is cut from it.
                day="$(date -u +%Y%m%d -d "@$(git log -1 --format=%ct)")"
                tag="postflight-cli/rc-$day"
                title="postflight CLI release candidate $day"
                flags=(--prerelease)
                summary="Release candidate $day of the postflight CLI."
                ;;
              stable)
                tag="postflight-cli/v$version"
                title="postflight CLI v$version"
                flags=(--latest)
                summary="Release $version of the postflight CLI."
                ;;
            esac

            existing="$(tag_sha "$tag")"
            if [[ -n "$existing" && "$existing" != "$revision" ]]; then
              if [[ "$channel" == stable ]]; then
                echo "$channel: tag $tag already points at $existing, not $revision" >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              tag="$tag-$(date -u +%H%M -d "@$(git log -1 --format=%ct)")"
              existing="$(tag_sha "$tag")"
              if [[ -n "$existing" && "$existing" != "$revision" ]]; then
                echo "$channel: tag $tag already points at $existing, not $revision" >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
            fi
            # Create the tag ref first: the releases API 403s integration tokens
            # when target_commitish is a bare SHA (cli/cli#9514), while plain
            # ref creation with contents:write is fine.
            if [[ -z "$existing" ]]; then
              gh api -X POST "repos/${{ github.repository }}/git/refs" \
                -f ref="refs/tags/$tag" -f sha="$revision" > /dev/null
            fi

            sources="- Sources: \`postflight-$version-src.tar.gz\`"
            if [[ "$sources_make" == 1 ]]; then
              sources="$sources (\`make && sudo make install\`)"
            fi
            # The body is read back by machine: the install canary greps it for
            # the pinned digest, and a stable cut walks the candidates' source
            # commits out of it. The version line is what the author of the
            # next pin reads the pin's `version` off.
            notes="$(printf '%s\n' \
              "$summary" \
              "" \
              "- Version: \`$version\`" \
              "- Artifact: \`$image\`" \
              "- Source commit: $revision" \
              "- Binaries digest: \`$binaries_digest\`" \
              "$sources" \
              "" \
              "Verify any binary before running it:" \
              "" \
              '```sh' \
              "cosign verify-blob --bundle postflight-<target>.sigstore.json \\" \
              "  --certificate-identity $BUILD_IDENTITY \\" \
              "  --certificate-oidc-issuer $ISSUER \\" \
              "  postflight-<target>" \
              '```' \
              "" \
              "\`install.sh\` is attached too, signed by the release lane, so the installer can be verified before it is run rather than piped in from the website:" \
              "" \
              '```sh' \
              "cosign verify-blob --bundle install.sh.sigstore.json \\" \
              "  --certificate-identity $RELEASE_IDENTITY \\" \
              "  --certificate-oidc-issuer $ISSUER \\" \
              "  install.sh" \
              '```')"
            gh release create "$tag" \
              --title "$title" \
              "${flags[@]}" \
              --notes "$notes" \
              "assets/$channel"/*
            echo "released $tag from $image" >> "$GITHUB_STEP_SUMMARY"
          done 3< plan.txt

      - name: Mirror the Homebrew formula
        if: contains(steps.plan.outputs.cuts, 'stable')
        env:
          GH_TOKEN: ${{ steps.tap.outputs.token }}
          TAP: ${{ github.repository_owner }}/homebrew-tap
          FORMULA: src/products/postflight-cli/dist/homebrew
        run: |
          . meta/stable.env

          # The renderer takes the version on argv and the formula's own `test`
          # block asserts it back out of the binary at install time; assert it
          # here, off the verified artifact, rather than on a user's machine.
          reported="$("assets/stable/postflight-$NATIVE_TARGET" version | head -n 1)"
          if [[ "$reported" != "postflight version $version" ]]; then
            echo "stable: the formula would promise $version but the artifact reports '$reported'" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          "$FORMULA/render-formula.sh" "$FORMULA/postflight.rb.tmpl" \
            "$version" assets/stable/checksums.txt > postflight.rb

          # On 404 gh api prints the error JSON to stdout and --jq never
          # applies — only the exit code says whether the tap already carries a
          # formula, whose blob sha an update has to name.
          previous=()
          if sha="$(gh api "repos/$TAP/contents/Formula/postflight.rb" \
              --jq .sha 2>/dev/null)"; then
            previous=(-f sha="$sha")
          fi
          gh api -X PUT "repos/$TAP/contents/Formula/postflight.rb" \
            -f message="postflight $version" \
            -f content="$(base64 -w0 postflight.rb)" \
            "${previous[@]}" > /dev/null
          echo "mirrored postflight $version to $TAP" >> "$GITHUB_STEP_SUMMARY"
