[project]
name = "guardian-bench"
version = "0.1.0"
description = "Personal-assistant anticipation benchmark: single-turn state-diff grading over a principal's life-database."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
keywords = ["personal-assistant", "anticipation", "eval", "benchmark", "verifiers"]
dependencies = [
    "verifiers==0.2.1",
]

[dependency-groups]
dev = [
    "prime==0.6.21",
    "pytest==8.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guardian_bench"]
