[package]
name = "postflight"
version = "0.2.0-rc.1"
edition = "2024"
rust-version = "1.97"
description = "Command-line front door for Postflight, fast CI for GitHub by Guardian Intelligence"
license = "MIT"
repository = "https://github.com/guardian-intelligence/guardian"
homepage = "https://guardianintelligence.org/postflight"
readme = "README.md"
keywords = ["ci", "github", "postflight", "devops", "cli"]
categories = ["command-line-utilities", "development-tools::build-utils"]
include = [
    "src/**",
    "Cargo.toml",
    "README.md",
    "Makefile",
    "LICENSE",
]

[[bin]]
name = "postflight"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/postflight-cli%2Fv{ version }/postflight-{ target }"
pkg-fmt = "bin"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ureq = { version = "3.1", features = ["json"] }
