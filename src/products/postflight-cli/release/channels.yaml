# Channel pins for the postflight CLI release train. Each pin merge triggers
# postflight-cli-release.yml, which verifies the pinned artifact's signature
# chain and publishes a GitHub Release reusing the signatures minted at build
# time (ghcr.io/guardian-intelligence/postflight-cli).
#
# nightly is advanced by Kargo promotion PRs — never edit it by hand. rc and
# stable have no Kargo stage: a human PR advances them, and the same commit
# must mirror the digest into the matching releases.postflight-cli lane in
# src/infrastructure/deployments/guardian/system/release-manifest.yaml.
channels:
  nightly:
    image: ghcr.io/guardian-intelligence/postflight-cli@sha256:1c61b15daaeab034d6e85bcac397be1a5b458e89b9422f55d2cdd59baa36f460
  rc:
    image: ghcr.io/guardian-intelligence/postflight-cli@sha256:1c61b15daaeab034d6e85bcac397be1a5b458e89b9422f55d2cdd59baa36f460
    version: 0.2.0-rc.1
  stable:
    image: ghcr.io/guardian-intelligence/postflight-cli@sha256:f8c69a8da836247d50221c66a3bf5843da891617151db1ccf309574d780d6030
    version: 0.2.0
