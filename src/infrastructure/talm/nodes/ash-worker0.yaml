# talm: nodes=["206.223.228.99"], endpoints=["206.223.228.99"], templates=["templates/controlplane.yaml"]
# First annual control-plane stage. Preserve data SSD 362510FCEFD5.
# No RawVolumeConfig/UserVolumeConfig may target that disk in this stage.
machine:
  type: controlplane
  certSANs: &id001
    - 127.0.0.1
    - api.guardianintelligence.org
    - k8s.guardianintelligence.org
    - 10.8.0.250
    - 206.223.228.101
    - 45.250.254.119
    - 206.223.228.87
    - 206.223.228.99
  kubelet:
    extraConfig:
      cpuManagerPolicy: static
      maxPods: 512
    nodeIP:
      validSubnets:
        - 10.8.0.0/24
  install:
    diskSelector:
      serial: 362510FCEFF6
    image: factory.talos.dev/metal-installer-secureboot/be66fdc8a38c2f517f33cba0a6daa7ab97ff87d51e8ca7d2160e45911ba09cf5:v1.13.10@sha256:e892079895b227a83fd86c1249efbbc3684c61815e5b5efcffd3cc279e56703b
  files:
    - content: |
        [plugins]
          [plugins."io.containerd.grpc.v1.cri"]
            device_ownership_from_security_context = true
          [plugins."io.containerd.cri.v1.runtime"]
            device_ownership_from_security_context = true
      permissions: 0o0
      path: /etc/cri/conf.d/20-customization.part
      op: create
    - content: |
        backup {
          backup = 0
          archive = 0
        }
        devices {
           global_filter = [ "a|^/dev/mapper/luks2-r-guardian-data$|", "r|^/dev/drbd.*|", "r|^/dev/dm-.*|", "r|^/dev/zd.*|", "r|^/dev/loop.*|" ]
        }
      permissions: 0o644
      path: /etc/lvm/lvm.conf
      op: overwrite
  sysctls:
    net.core.netdev_budget: "600"
    net.core.netdev_budget_usecs: "8000"
    net.core.netdev_max_backlog: "5000"
    net.ipv4.neigh.default.gc_thresh1: "4096"
    net.ipv4.neigh.default.gc_thresh2: "8192"
    net.ipv4.neigh.default.gc_thresh3: "16384"
    net.ipv4.tcp_fin_timeout: "30"
    net.ipv4.tcp_orphan_retries: "3"
  features:
    kubernetesTalosAPIAccess:
      enabled: true
      allowedRoles:
        - os:etcd:backup
      allowedKubernetesNamespaces:
        - tenant-root
  logging:
    destinations:
      - endpoint: tcp://10.8.0.200:5170
        format: json_lines
        extraTags:
          node: ash-worker0
  kernel:
    modules:
      - name: openvswitch
      - name: drbd
        parameters:
          - usermode_helper=disabled
      - name: zfs
      - name: spl
      - name: vfio_pci
      - name: vfio_iommu_type1
  nodeLabels:
    guardian.dev/openbao-static-seal: "false"
cluster:
  controlPlane:
    endpoint: https://10.8.0.250:6443
  clusterName: guardian-mgmt
  network:
    cni:
      name: none
    dnsDomain: cozy.local
    serviceSubnets:
      - 10.96.0.0/16
  apiServer:
    extraArgs:
      oidc-client-id: kubernetes
      oidc-groups-claim: groups
      oidc-issuer-url: https://keycloak.guardianintelligence.org/realms/cozy
      oidc-username-claim: preferred_username
    certSANs: *id001
  controllerManager:
    extraArgs:
      allocate-node-cidrs: "true"
      bind-address: 0.0.0.0
      cluster-cidr: 10.244.0.0/16
  proxy:
    disabled: true
  scheduler:
    extraArgs:
      bind-address: 0.0.0.0
  discovery:
    enabled: false
  etcd:
    extraArgs:
      listen-metrics-urls: http://127.0.0.1:2381
      metrics: extensive
      quota-backend-bytes: "8589934592"
    advertisedSubnets:
      - 10.8.0.0/24
  adminKubeconfig:
    certLifetime: 8h0m0s
  allowSchedulingOnControlPlanes: true
---
apiVersion: v1alpha1
kind: RegistryMirrorConfig
name: docker.io
endpoints:
  - url: https://mirror.gcr.io
---
apiVersion: v1alpha1
kind: RegistryMirrorConfig
name: ghcr.io
endpoints:
  - url: http://10.8.0.201:5000
---
apiVersion: v1alpha1
kind: WatchdogTimerConfig
device: /dev/watchdog0
timeout: 1m
---
apiVersion: v1alpha1
kind: VolumeConfig
name: STATE
encryption:
  provider: luks2
  keys:
    - slot: 0
      tpm:
        checkSecurebootStatusOnEnroll: true
        options:
          pcrs:
            - 7
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
encryption:
  provider: luks2
  keys:
    - slot: 0
      tpm:
        checkSecurebootStatusOnEnroll: true
        options:
          pcrs:
            - 7
      lockToState: true
---
apiVersion: v1alpha1
kind: NetworkDefaultActionConfig
