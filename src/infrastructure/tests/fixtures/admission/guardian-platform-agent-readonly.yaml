policy: guardian-platform-agent-readonly
cases:
  - name: pod port-forward
    operation: CONNECT
    resource: { group: "", version: v1, resource: pods }
    subResource: portforward
    objectName: some-pod
    user: { username: "keycloak:cozy#platform-agent", groups: ["system:authenticated"] }
    expect: allow
  - name: mint Mythra observer token matched by group
    operation: CREATE
    resource: { group: "", version: v1, resource: serviceaccounts }
    subResource: token
    objectName: guardian-mythra-observer
    object:
      apiVersion: authentication.k8s.io/v1
      kind: TokenRequest
      metadata: { name: guardian-mythra-observer, namespace: tenant-guardian-prod }
      spec:
        audiences: [https://10.8.0.250:6443]
        expirationSeconds: 900
    user:
      {
        username: "keycloak:cozy#other",
        groups: ["guardian-platform-agent", "system:authenticated"],
      }
    expect: allow
  - name: mint fifteen-minute Mythra operator token
    operation: CREATE
    resource: { group: "", version: v1, resource: serviceaccounts }
    subResource: token
    objectName: guardian-mythra-operator
    object:
      apiVersion: authentication.k8s.io/v1
      kind: TokenRequest
      metadata: { name: guardian-mythra-operator, namespace: tenant-guardian-prod }
      spec:
        audiences: [https://10.8.0.250:6443]
        expirationSeconds: 900
    user: { username: "keycloak:cozy#platform-agent", groups: ["system:authenticated"] }
    expect: allow
  - name: mint fifteen-minute Mythra observer token
    operation: CREATE
    resource: { group: "", version: v1, resource: serviceaccounts }
    subResource: token
    objectName: guardian-mythra-observer
    object:
      apiVersion: authentication.k8s.io/v1
      kind: TokenRequest
      metadata: { name: guardian-mythra-observer, namespace: tenant-guardian-prod }
      spec:
        audiences: [https://10.8.0.250:6443]
        expirationSeconds: 900
    user: { username: "keycloak:cozy#platform-agent", groups: ["system:authenticated"] }
    expect: allow
  - name: mint Mythra operator token longer than fifteen minutes
    operation: CREATE
    resource: { group: "", version: v1, resource: serviceaccounts }
    subResource: token
    objectName: guardian-mythra-operator
    object:
      apiVersion: authentication.k8s.io/v1
      kind: TokenRequest
      metadata: { name: guardian-mythra-operator, namespace: tenant-guardian-prod }
      spec:
        audiences: [https://10.8.0.250:6443]
        expirationSeconds: 901
    user: { username: "keycloak:cozy#platform-agent", groups: ["system:authenticated"] }
    expect: deny
  - name: mint secrets-writer token
    operation: CREATE
    resource: { group: "", version: v1, resource: serviceaccounts }
    subResource: token
    objectName: secrets-writer
    user: { username: "keycloak:cozy#platform-agent", groups: ["system:authenticated"] }
    expect: deny
  - name: another read persona is not matched
    operation: CONNECT
    resource: { group: "", version: v1, resource: pods }
    subResource: portforward
    objectName: some-pod
    user:
      { username: "keycloak:cozy#other", groups: ["guardian-persona-read", "system:authenticated"] }
    expect: no-match
