# The mutation's behavior is pinned here: the barman-cloud ObjectStore the
# backup driver projects gets an immediate backup checkpoint whether or not
# it carries a data block, and an explicit choice on the object wins.
policy: guardian-postgres-backup-checkpoint
cases:
  - name: object store with a data block gets an immediate checkpoint
    resource: {group: barmancloud.cnpg.io, version: v1, resource: objectstores}
    object:
      apiVersion: barmancloud.cnpg.io/v1
      kind: ObjectStore
      metadata: {name: postgres-app, namespace: tenant-guardian-prod}
      spec:
        configuration:
          destinationPath: s3://guardian-backups/tenant-guardian-prod/postgres-app/
          s3Credentials:
            accessKeyId:
              name: cozy-backups-creds
              key: AWS_ACCESS_KEY_ID
            secretAccessKey:
              name: cozy-backups-creds
              key: AWS_SECRET_ACCESS_KEY
          data:
            compression: bzip2
          wal:
            compression: gzip
    expect: mutate
    expectField: {path: spec.configuration.data.immediateCheckpoint, value: true}
  - name: object store without a data block gets an immediate checkpoint
    resource: {group: barmancloud.cnpg.io, version: v1, resource: objectstores}
    object:
      apiVersion: barmancloud.cnpg.io/v1
      kind: ObjectStore
      metadata: {name: postgres-nodata, namespace: tenant-guardian-prod}
      spec:
        configuration:
          destinationPath: s3://guardian-backups/tenant-guardian-prod/postgres-nodata/
          s3Credentials:
            accessKeyId:
              name: cozy-backups-creds
              key: AWS_ACCESS_KEY_ID
            secretAccessKey:
              name: cozy-backups-creds
              key: AWS_SECRET_ACCESS_KEY
          wal:
            compression: gzip
    expect: mutate
    expectField: {path: spec.configuration.data.immediateCheckpoint, value: true}
  - name: explicit immediateCheckpoint is preserved
    resource: {group: barmancloud.cnpg.io, version: v1, resource: objectstores}
    object:
      apiVersion: barmancloud.cnpg.io/v1
      kind: ObjectStore
      metadata: {name: postgres-explicit, namespace: tenant-guardian-prod}
      spec:
        configuration:
          destinationPath: s3://guardian-backups/tenant-guardian-prod/postgres-explicit/
          s3Credentials:
            accessKeyId:
              name: cozy-backups-creds
              key: AWS_ACCESS_KEY_ID
            secretAccessKey:
              name: cozy-backups-creds
              key: AWS_SECRET_ACCESS_KEY
          data:
            immediateCheckpoint: false
          wal:
            compression: gzip
    expect: no-match
