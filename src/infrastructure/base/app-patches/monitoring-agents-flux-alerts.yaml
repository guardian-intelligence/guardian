# VMRule preserves unknown fields, so its rule group is atomic under server-side
# apply: the whole chart group rides along to change any one hold duration. The
# prod application Kustomizations legitimately spend five to six minutes unready
# on every merge — rollout health checks gate them through progressive delivery —
# which sits exactly on the chart's five-minute hold, so each deploy paged major
# and closed a minute later. Fifteen minutes is the duration every one of these
# rules already promises in its own description; only the hold moves.
#
# The expressions aggregate away ready/revision and scrape-identity labels
# because they are part of the series identity: a Kustomization stuck in a
# reconcile loop cycles Ready Unknown -> False -> Unknown, and each flip (or a
# new revision landing mid-failure, or kube-state-metrics rescheduling) ends
# the series, auto-resolves the alert, and re-arms the fifteen-minute hold —
# paging as a metronomic flap instead of one sustained alert.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: alerts-flux-resources
  namespace: cozy-monitoring
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Override
spec:
  groups:
    - name: flux-resources-alerts
      rules:
        - alert: HelmReleaseNotReady
          expr: max without (ready, revision, instance, pod, node) (gotk_resource_info{customresource_kind="HelmRelease", ready!="True"}) > 0
          for: 15m
          labels:
            severity: major
            service: fluxcd
            exported_instance: "{{ $labels.exported_namespace }}/{{ $labels.name }}"
          annotations:
            summary: "HelmRelease {{ $labels.name }} in namespace {{ $labels.exported_namespace }} is not ready"
            description: "HelmRelease {{ $labels.name }} in namespace {{ $labels.exported_namespace }} is in an unready state for more than 15 minutes."
        - alert: GitRepositorySyncFailed
          expr: max without (ready, revision, instance, pod, node) (gotk_resource_info{customresource_kind="GitRepository", ready!="True"}) > 0
          for: 15m
          labels:
            severity: major
            service: fluxcd
            exported_instance: "{{ $labels.exported_namespace }}/{{ $labels.name }}"
          annotations:
            summary: "GitRepository {{ $labels.name }} in namespace {{ $labels.exported_namespace }} sync failed"
            description: "GitRepository {{ $labels.name }} in namespace {{ $labels.exported_namespace }} has not been successfully synced for more than 15 minutes."
        - alert: KustomizationNotApplied
          expr: max without (ready, revision, instance, pod, node) (gotk_resource_info{customresource_kind="Kustomization", ready!="True"}) > 0
          for: 15m
          labels:
            severity: major
            service: fluxcd
            exported_instance: "{{ $labels.exported_namespace }}/{{ $labels.name }}"
          annotations:
            summary: "Kustomization {{ $labels.name }} in namespace {{ $labels.exported_namespace }} is not applied"
            description: "Kustomization {{ $labels.name }} in namespace {{ $labels.exported_namespace }} is not successfully applied for more than 15 minutes."
        - alert: ImageRepositorySyncFailed
          expr: max without (ready, revision, instance, pod, node) (gotk_resource_info{customresource_kind="ImageRepository", ready!="True"}) > 0
          for: 15m
          labels:
            severity: major
            service: fluxcd
            exported_instance: "{{ $labels.exported_namespace }}/{{ $labels.name }}"
          annotations:
            summary: "ImageRepository {{ $labels.name }} in namespace {{ $labels.exported_namespace }} sync failed"
            description: "ImageRepository {{ $labels.name }} in namespace {{ $labels.exported_namespace }} has not been successfully synced for more than 15 minutes."
        - alert: HelmChartFailed
          expr: max without (ready, revision, instance, pod, node) (gotk_resource_info{customresource_kind="HelmChart", ready!="True"}) > 0
          for: 15m
          labels:
            severity: major
            service: fluxcd
            exported_instance: "{{ $labels.exported_namespace }}/{{ $labels.name }}"
          annotations:
            summary: "HelmChart {{ $labels.name }} in namespace {{ $labels.exported_namespace }} has failed"
            description: "HelmChart {{ $labels.name }} in namespace {{ $labels.exported_namespace }} is not ready for more than 15 minutes."
        - alert: HelmReleaseSuspended
          expr: max without (ready, revision, instance, pod, node) (gotk_resource_info{customresource_kind="HelmRelease", suspended="true"}) > 0
          for: 5m
          labels:
            severity: warning
            service: fluxcd
            exported_instance: "{{ $labels.exported_namespace }}/{{ $labels.name }}"
          annotations:
            summary: "HelmRelease {{ $labels.name }} in namespace {{ $labels.exported_namespace }} is suspended"
            description: "HelmRelease {{ $labels.name }} in namespace {{ $labels.exported_namespace }} has been suspended."
        - alert: GitRepositorySuspended
          expr: max without (ready, revision, instance, pod, node) (gotk_resource_info{customresource_kind="GitRepository", suspended="true"}) > 0
          for: 5m
          labels:
            severity: warning
            service: fluxcd
            exported_instance: "{{ $labels.exported_namespace }}/{{ $labels.name }}"
          annotations:
            summary: "GitRepository {{ $labels.name }} in namespace {{ $labels.exported_namespace }} is suspended"
            description: "GitRepository {{ $labels.name }} in namespace {{ $labels.exported_namespace }} has been suspended."
        - alert: KustomizationSuspended
          expr: max without (ready, revision, instance, pod, node) (gotk_resource_info{customresource_kind="Kustomization", suspended="true"}) > 0
          for: 5m
          labels:
            severity: warning
            service: fluxcd
            exported_instance: "{{ $labels.exported_namespace }}/{{ $labels.name }}"
          annotations:
            summary: "Kustomization {{ $labels.name }} in namespace {{ $labels.exported_namespace }} is suspended"
            description: "Kustomization {{ $labels.name }} in namespace {{ $labels.exported_namespace }} has been suspended."
        - alert: ImageRepositorySuspended
          expr: max without (ready, revision, instance, pod, node) (gotk_resource_info{customresource_kind="ImageRepository", suspended="true"}) > 0
          for: 5m
          labels:
            severity: warning
            service: fluxcd
            exported_instance: "{{ $labels.exported_namespace }}/{{ $labels.name }}"
          annotations:
            summary: "ImageRepository {{ $labels.name }} in namespace {{ $labels.exported_namespace }} is suspended"
            description: "ImageRepository {{ $labels.name }} in namespace {{ $labels.exported_namespace }} has been suspended."
        - alert: HelmChartSuspended
          expr: max without (ready, revision, instance, pod, node) (gotk_resource_info{customresource_kind="HelmChart", suspended="true"}) > 0
          for: 5m
          labels:
            severity: warning
            service: fluxcd
            exported_instance: "{{ $labels.exported_namespace }}/{{ $labels.name }}"
          annotations:
            summary: "HelmChart {{ $labels.name }} in namespace {{ $labels.exported_namespace }} is suspended"
            description: "HelmChart {{ $labels.name }} in namespace {{ $labels.exported_namespace }} has been suspended."
