# Base backups must not race statement_timeout. Without immediateCheckpoint,
# pg_backup_start waits for the in-progress spread checkpoint (a restartpoint
# on standby targets), whose write phase is paced by
# checkpoint_completion_target and routinely runs as long as the platform's
# 120s statement_timeout — so whether a nightly base backup starts is a coin
# flip on checkpoint phase. An immediate checkpoint bounds the wait at the
# cost of one unpaced buffer flush.
#
# The backupstrategy-controller's CNPG strategy template cannot express this
# (its data schema carries only compression/encryption/jobs), so the default
# is applied at admission. Since the barman-cloud plugin migration the driver
# no longer writes Cluster.spec.backup.barmanObjectStore: it projects the
# object-store settings into a barmancloud.cnpg.io ObjectStore that the
# Cluster references through the plugin, and server-side applies it with
# every nightly backup, so the default lands on that object. An ObjectStore
# that sets the field explicitly keeps its choice.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: guardian-postgres-backup-checkpoint
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups:
          - barmancloud.cnpg.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - objectstores
  matchConditions:
    - name: no-explicit-checkpoint-choice
      expression: >-
        !has(object.spec.configuration.data) ||
        !has(object.spec.configuration.data.immediateCheckpoint)
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              configuration: Object.spec.configuration{
                data: Object.spec.configuration.data{
                  immediateCheckpoint: true
                }
              }
            }
          }
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: guardian-postgres-backup-checkpoint
spec:
  policyName: guardian-postgres-backup-checkpoint
