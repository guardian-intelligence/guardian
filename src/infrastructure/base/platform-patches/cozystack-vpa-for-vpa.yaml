# The self-recommender loads eight days of Prometheus history during startup.
# Its first recommendation can predate that bootstrap peak and admit its own
# replacement below the history-loading peak, leaving it in an OOM loop.
# Keep Initial-mode self-sizing, but reserve enough memory for that bootstrap.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-for-vpa
  namespace: cozy-vpa-for-vpa
spec:
  resourcePolicy:
    containerPolicies:
      - containerName: recommender
        minAllowed:
          memory: 1Gi
