# Cozystack owns the generated cluster's topology and sizing. Guardian owns only
# the security boundaries and disk-pressure relief that its API omits.
apiVersion: operator.victoriametrics.com/v1
kind: VLCluster
metadata:
  name: generic
  namespace: tenant-root
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Override
spec:
  useStrictSecurity: true
  vlinsert:
    useStrictSecurity: true
    disableAutomountServiceAccountToken: true
    extraArgs:
      select.disable: "true"
  vlselect:
    useStrictSecurity: true
    disableAutomountServiceAccountToken: true
    extraArgs:
      insert.disable: "true"
  vlstorage:
    useStrictSecurity: true
    disableAutomountServiceAccountToken: true
    extraArgs:
      # VictoriaLogs measures this against the filesystem's total size, but
      # KubePersistentVolumeFillingUp measures kubelet's available bytes,
      # which exclude ext4's 5% reserved blocks: a cap of 80 parks steady
      # state at ~14.4% available, inside the alert's 15% band. 70 leaves
      # ~25% available at the top of the per-day partition sawtooth.
      retention.maxDiskUsagePercent: "70"
