apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: blackbox-exporter
    namespace: tenant-root
    files:
      - blackbox.yml
generatorOptions:
  labels:
    app.kubernetes.io/name: blackbox-exporter
    app.kubernetes.io/part-of: guardian
    guardian.dev/component: alerting
resources:
  - secrets.yaml
  - relay.yaml
  - networkpolicy.yaml
  - observability.yaml
  - alertmanager-config.yaml
  - alerting-plane-health.yaml
  - audit-alerts.yaml
  - blackbox-exporter.yaml
  - cilium-drop-metrics.yaml
  - clickhouse-backup-alerts.yaml
  - core-metrics-wiring.yaml
  - etcd-snapshot-alerts.yaml
  - ingress-error-alerts.yaml
  - log-pipeline-health.yaml
  - postgres-alerts.yaml
  - synthetic-probes.yaml
  - talos-host-log-alerts.yaml
  - trust-alerts.yaml
  - tsdb-alerts.yaml
  - vmalert-vlogs.yaml
patches:
  # Postflight has no public execution service while temporarily paused.
  # Company, infrastructure, storage, and identity probes remain active.
  - target:
      group: operator.victoriametrics.com
      version: v1beta1
      kind: VMProbe
      name: postflight-prod-edge
    patch: |-
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMProbe
      metadata:
        name: postflight-prod-edge
        namespace: tenant-root
      $patch: delete
