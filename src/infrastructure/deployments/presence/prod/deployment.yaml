# presenced: the Wake Up Mythra presence plane (grid-world demo).
#
# hostNetwork with a node pin: WebTransport needs public UDP 4433 and the
# edge (Cloudflare) cannot proxy it, so the pod binds the node's public IP
# directly (TigerBeetle precedent). The browser page is served through the
# normal proxied ingress; only the QUIC dial goes direct, authenticated by
# the certificate hash the page fetches from /mythra/wt-info.
#
# Deliberately NO reloader annotation: behavior and asset ConfigMap changes
# must reach the running process via the kubelet mount refresh (hot reload,
# zero disconnects) - a pod restart here would defeat the update ladder this
# service demonstrates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: presenced
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: presenced
    app.kubernetes.io/part-of: guardian
    app.kubernetes.io/component: presenced
    guardian.dev/product: presence
    guardian.dev/stage: prod
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # hostNetwork ports cannot overlap, so never surge a second pod; expressed
  # as a constrained RollingUpdate because flipping strategy type on a live
  # Deployment trips server-side apply on the defaulted rollingUpdate block.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: presenced
  template:
    metadata:
      labels:
        app.kubernetes.io/name: presenced
        app.kubernetes.io/part-of: guardian
        app.kubernetes.io/component: presenced
        guardian.dev/product: presence
        guardian.dev/stage: prod
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      priorityClassName: guardian-standard
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: ash-earth
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: presenced
          image: ghcr.io/guardian-intelligence/presenced:edge@sha256:c304b133c91db84a3149303211abc2495fd19f315e85326cf5d410939e3ac30b # {"$imagepolicy": "guardian-imageops:presenced"}
          env:
            - name: TICK_HZ
              value: "24"
            - name: WT_PORT
              value: "4433"
            - name: HTTP_PORT
              value: "9634"
            - name: METRICS_PORT
              value: "9633"
            - name: PUBLIC_ADDR
              value: "wt.wakeupmythra.com:4433" # DNS-only record -> ash-earth
            - name: TLS_CERT_FILE
              value: /etc/mythra/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/mythra/tls/tls.key
            - name: ALLOWED_ORIGINS
              value: "https://guardianintelligence.org,https://wakeupmythra.com"
            - name: BEHAVIOR_DIR
              value: /etc/mythra/behavior
            - name: ASSET_DIR
              value: /etc/mythra/assets
          ports:
            - name: wt
              containerPort: 4433
              protocol: UDP
            - name: http
              containerPort: 9634
              protocol: TCP
            - name: metrics
              containerPort: 9633
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: behavior
              mountPath: /etc/mythra/behavior
              readOnly: true
            - name: assets
              mountPath: /etc/mythra/assets
              readOnly: true
            - name: wt-tls
              mountPath: /etc/mythra/tls
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
              ephemeral-storage: 512Mi
      volumes:
        - name: behavior
          configMap:
            name: mythra-behavior
        - name: assets
          configMap:
            name: mythra-assets
        # optional: the pod runs on the self-signed fallback until the first
        # ACME issuance lands; the server hot-loads the real cert on arrival.
        - name: wt-tls
          secret:
            secretName: mythra-wt-tls
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: presenced
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: presenced
    app.kubernetes.io/part-of: guardian
    guardian.dev/product: presence
    guardian.dev/stage: prod
spec:
  selector:
    app.kubernetes.io/component: presenced
  ports:
    - name: http
      port: 80
      targetPort: 9634
      protocol: TCP
    - name: wt
      port: 4433
      targetPort: 4433
      protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: presenced-metrics
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: presenced
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: guardian
    guardian.dev/stage: prod
spec:
  selector:
    app.kubernetes.io/component: presenced
  ports:
    - name: metrics
      port: 9633
      targetPort: 9633
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: presenced
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: presenced
    app.kubernetes.io/part-of: guardian
    guardian.dev/stage: prod
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "65"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "65"
spec:
  ingressClassName: tenant-root
  rules:
    - host: guardianintelligence.org
      http:
        paths:
          - path: /mythra
            pathType: Prefix
            backend:
              service:
                name: presenced
                port:
                  number: 80
---
# The product apex. A dedicated Ingress (not another rule on the demo host's
# object) keeps this zone's Origin CA cutover and AOP mTLS gate off the
# working guardianintelligence.org/mythra route - same isolation as the
# rumi.engineering ingress. The game is served at "/" here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: presenced-mythra
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: presenced
    app.kubernetes.io/part-of: guardian
    guardian.dev/product: presence
    guardian.dev/stage: prod
  annotations:
    # Cloudflare terminates public TLS and proves itself to the origin via
    # AOP mTLS; the origin-pull CA Secret already lives in this namespace
    # (company kustomization). Only verified-edge fetches reach the backend.
    nginx.ingress.kubernetes.io/auth-tls-secret: tenant-guardian-prod/cloudflare-origin-pull-ca
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: tenant-root
  # wakeupmythra.com is not covered by the controller's default certificate
  # (the guardianintelligence.org Origin CA cert); this tls block registers
  # the zone's ACME-issued leaf for SNI selection.
  tls:
    - hosts:
        - wakeupmythra.com
      secretName: mythra-origin-tls
  rules:
    - host: wakeupmythra.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: presenced
                port:
                  number: 80
