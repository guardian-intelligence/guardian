# The world-sim behavior scripts, hot-loaded by presenced without a restart.
# live.lua is the running behavior; adding shadow.lua starts a shadow launch
# (evaluated every tick, outputs diffed, divergence exported as metrics,
# world untouched). Promotion = move shadow's content into live.lua.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mythra-behavior
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: presenced
    app.kubernetes.io/part-of: guardian
    guardian.dev/product: presence
    guardian.dev/stage: prod
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  live.lua: |
    -- v1: every few ticks, each dog takes one step in a random direction.
    -- rand(n) is host-provided and deterministic in (dog, tick), so identical
    -- scripts in live and shadow slots produce zero divergence.
    function step(tick, dog, x, y, w, h)
      if tick % 6 ~= 0 then
        return 0, 0
      end
      local r = rand(4)
      if r == 0 then return 1, 0 end
      if r == 1 then return -1, 0 end
      if r == 2 then return 0, 1 end
      return 0, -1
    end
---
# Content-addressed dog skins. skins.json picks the default; a skin only
# takes effect once its asset file is present, so snapshots can never
# reference an asset the server cannot serve.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mythra-assets
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: presenced
    app.kubernetes.io/part-of: guardian
    guardian.dev/product: presence
    guardian.dev/stage: prod
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  skins.json: |
    {"default": "dog"}
  dog.svg: |
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><path d="M2 10c0-3 2-5 5-5h3l2-2 2 1-1 3v3c0 2-2 4-5 4H6c-2 0-4-1-4-4z" fill="#111"/><path d="M12 3l1.6-.8.9 1.5-1.5 1z" fill="#111"/><circle cx="11.2" cy="7" r=".8" fill="#fff"/><path d="M3 13l-1 2h2z" fill="#111"/></svg>
