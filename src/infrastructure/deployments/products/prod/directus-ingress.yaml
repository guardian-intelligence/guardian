# Public route for the letters CMS Studio. Authentication is Directus's
# own session on top of Keycloak SSO (registration off), so the edge
# exposes only the login surface; the apex Origin CA certificate covers
# this first-level subdomain, so no per-Ingress tls block is needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: directus
  namespace: tenant-guardian-prod
  annotations:
    nginx.ingress.kubernetes.io/auth-tls-secret: tenant-guardian-prod/cloudflare-origin-pull-ca
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  labels:
    app.kubernetes.io/name: directus
    app.kubernetes.io/part-of: guardian
    guardian.dev/product: company-site
    guardian.dev/stage: prod
spec:
  ingressClassName: tenant-root
  rules:
    - host: cms.guardianintelligence.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: directus
                port:
                  number: 80
---
# Workload DNS is declared, not clicked: external-dns (sources: [crd])
# reconciles this record with its DNS-only token. Proxied through
# Cloudflare so the edge terminates TLS and enforces AOP toward the
# origin, same as the apex; targets are the three ingress node IPs.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: directus-cms
  namespace: tenant-guardian-prod
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
  labels:
    app.kubernetes.io/name: directus
    app.kubernetes.io/part-of: guardian
    guardian.dev/product: company-site
    guardian.dev/stage: prod
spec:
  endpoints:
    - dnsName: cms.guardianintelligence.org
      recordType: A
      targets:
        - 206.223.228.101
        - 45.250.254.119
        - 206.223.228.87
