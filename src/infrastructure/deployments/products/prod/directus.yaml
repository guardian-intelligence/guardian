# Directus: the letters source of truth for company-site. The SSR server
# fetches published letters from this service at request time (anonymous,
# permission-filtered to letters with a summary — drafts never leave the
# Studio). Availability is layered rather than duplicated: the site serves
# its last-good fetch through a Directus outage, and Cloudflare edge-caches
# /letters* with stale-if-error, so a CMS outage degrades to staleness, not
# errors, for any page the edge has seen.
#
# The Data Studio is routed at https://cms.guardianintelligence.org behind
# Keycloak OIDC (client `directus` in the customer realm): public
# registration is off, so only pre-created Directus users — the scoped
# letters editor — can sign in through SSO. The local admin account is the
# ops/break-glass identity and stays off the SSO path; reach it the old way
# via `kubectl port-forward -n tenant-guardian-prod svc/directus 8055:80`
# with admin@guardianintelligence.org and Secret/directus-admin-credential.
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  name: directus
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: directus
    app.kubernetes.io/part-of: guardian
    guardian.dev/product: company-site
    guardian.dev/stage: prod
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Single replica on a ReadWriteOnce uploads volume: a surged replacement
  # could never attach it, so rollouts take the brief authoring gap.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: directus
  template:
    metadata:
      annotations:
        # Bootstrap (migrations + first admin) runs only at container start;
        # bump this to roll the pod after an out-of-band database reset.
        guardian.dev/bootstrap-epoch: "v11-schema-reset-20260802"
      labels:
        app.kubernetes.io/name: directus
        app.kubernetes.io/part-of: guardian
        guardian.dev/product: company-site
        guardian.dev/stage: prod
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: directus
          # Held at 11.x deliberately: v12 license-enforces SSO and custom
          # permission rules out of the free Core tier, both of which this
          # deployment depends on. Moving to 12 means claiming the Directus
          # Open Innovation Grant first (LICENSE_KEY via OpenBao).
          image: docker.io/directus/directus:11.17.4@sha256:eb326f679ae847c0a776f93b972761dc2ebe84980e0b9d274a6bc31cd62809f7
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: DB_CLIENT
              value: pg
            - name: DB_HOST
              value: postgres-products-rw.tenant-guardian-prod.svc
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE
              value: directus
            - name: DB_USER
              value: directus
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-products-credentials
                  key: directus
            # Encrypt-without-CA-verification, the same posture as Electric's
            # sslmode=require against the operator-minted CNPG server cert.
            - name: DB_SSL__REJECT_UNAUTHORIZED
              value: "false"
            - name: DB_POOL__MAX
              value: "5"
            # Session-token signing key; without it Directus mints a random
            # one per boot and every authoring session dies on restart.
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: directus-app-secret
                  key: password
            # First-boot bootstrap creates this admin; on a populated
            # database the same envs are inert.
            - name: ADMIN_EMAIL
              value: admin@guardianintelligence.org
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: directus-admin-credential
                  key: password
            - name: PUBLIC_URL
              value: https://cms.guardianintelligence.org
            # Cloudflare terminates TLS and the root ingress forwards the
            # verified header chain; trust it so accountability logs carry
            # real client IPs.
            - name: IP_TRUST_PROXY
              value: "true"
            - name: AUTH_PROVIDERS
              value: keycloak
            - name: AUTH_KEYCLOAK_DRIVER
              value: openid
            - name: AUTH_KEYCLOAK_ISSUER_URL
              value: https://guardianintelligence.org/realms/guardianintelligence.org/.well-known/openid-configuration
            - name: AUTH_KEYCLOAK_CLIENT_ID
              value: directus
            - name: AUTH_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: directus-oidc-client
                  key: password
            - name: AUTH_KEYCLOAK_IDENTIFIER_KEY
              value: email
            # The realm is invisible: it has no login page, and the bounce
            # theme punts any un-hinted authorize request to the product
            # error surface. Every sign-in must arrive pre-hinted at the
            # GitHub broker.
            - name: AUTH_KEYCLOAK_PARAMS
              value: 'json:{"kc_idp_hint":"github"}'
            # The customer realm serves Postflight users too; an SSO login
            # only succeeds for users pre-created in Directus (the scoped
            # letters editor), everyone else is refused.
            - name: AUTH_KEYCLOAK_ALLOW_PUBLIC_REGISTRATION
              value: "false"
            - name: TELEMETRY
              value: "false"
            - name: WEBSOCKETS_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 8055
          # /server/health is auth-gated (403 to the anonymous role), so the
          # kubelet probes the public /server/ping instead.
          startupProbe:
            httpGet:
              path: /server/ping
              port: 8055
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /server/ping
              port: 8055
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /server/ping
              port: 8055
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: uploads
              mountPath: /directus/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: directus-uploads-encrypted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: directus-uploads-encrypted
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: directus
    app.kubernetes.io/part-of: guardian
    guardian.dev/product: company-site
    guardian.dev/stage: prod
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: replicated-encrypted
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: directus
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: directus
    app.kubernetes.io/part-of: guardian
    guardian.dev/product: company-site
    guardian.dev/stage: prod
spec:
  selector:
    app.kubernetes.io/name: directus
  ports:
    - name: http
      port: 80
      targetPort: 8055
