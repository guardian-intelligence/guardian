# The 2000-dogs-one-park load run (#1328 series). NOT wired into any
# kustomization: a one-shot Job an operator applies under write-basic and
# deletes after the run — Flux never reconciles it, results live in
# VictoriaMetrics (loadgen_* series pushed via VM_IMPORT_URL, run_source
# label below), never only in pod logs (docs/loadtest.md).
#
#   kubectl apply -f loadgen-park2000.yaml
#   kubectl -n tenant-guardian-prod logs -f job/mythrad-loadgen-park2000
#   kubectl -n tenant-guardian-prod delete job mythrad-loadgen-park2000
#
# Egress (dns, node:4433/udp, vminsert:8480) is admitted by the standing
# mythrad-loadgen CiliumNetworkPolicy keyed on the component label.
apiVersion: batch/v1
kind: Job
metadata:
  name: mythrad-loadgen-park2000
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: mythrad-loadgen
    app.kubernetes.io/part-of: guardian
    app.kubernetes.io/component: mythrad-loadgen
    guardian.dev/stage: prod
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mythrad-loadgen
        app.kubernetes.io/part-of: guardian
        app.kubernetes.io/component: mythrad-loadgen
        guardian.dev/stage: prod
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          # Same image as the service: the driver ships in /app/loadgen.
          image: ghcr.io/guardian-intelligence/mythrad:edge@sha256:e9eb67afab6aecb073594401618a106eea80b21af5081501ed1cec88b924e8a4
          imagePullPolicy: IfNotPresent
          command: ["/app/loadgen"]
          env:
            - name: TARGET_URL
              value: https://mythrad:4433/wt
            - name: SESSIONS
              value: "2000"
            - name: ROOMS
              value: "1"
            - name: RAMP_RATE
              value: "50"
            - name: HOLD_SEC
              value: "300"
            - name: STORM_SEC
              value: "60"
            - name: CHAT_SEC
              value: "0"
            - name: VM_IMPORT_URL
              value: http://vminsert-shortterm.tenant-root.svc:8480/insert/0/prometheus/api/v1/import/prometheus?extra_label=run_source%3Dpark2000&extra_label=surface%3Dmythra
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 128Mi
            limits:
              cpu: "4"
              memory: 4Gi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
