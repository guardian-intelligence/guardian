# mythrad: the Wake Up Mythra game service (session gateway + world sim).
#
# hostNetwork with a node pin: WebTransport needs public UDP 4433 and the
# edge (Cloudflare) cannot proxy it, so the pod binds the node's public IP
# directly (TigerBeetle precedent). The game-service HTTP paths (/wt-info,
# /behavior, /assets) are served through the normal proxied ingress; only
# the QUIC dial goes direct, authenticated by the certificate hash the page
# fetches from /wt-info.
#
# Deliberately NO reloader annotation: behavior and asset ConfigMap changes
# must reach the running process via the kubelet mount refresh (hot reload,
# zero disconnects) - a pod restart here would defeat the update ladder this
# service demonstrates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mythrad
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: mythrad
    app.kubernetes.io/part-of: guardian
    app.kubernetes.io/component: mythrad
    guardian.dev/product: mythra
    guardian.dev/stage: prod
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # hostNetwork ports cannot overlap, so never surge a second pod; expressed
  # as a constrained RollingUpdate because flipping strategy type on a live
  # Deployment trips server-side apply on the defaulted rollingUpdate block.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mythrad
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mythrad
        app.kubernetes.io/part-of: guardian
        app.kubernetes.io/component: mythrad
        guardian.dev/product: mythra
        guardian.dev/stage: prod
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      priorityClassName: guardian-standard
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: ash-earth
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mythrad
          image: ghcr.io/guardian-intelligence/mythrad:edge@sha256:8a3f0145ce9afdab8cefe7bc9e6bbde841a887d8e7c30a79aa7856eb65df7dd6 # {"$imagepolicy": "guardian-imageops:mythrad"}
          env:
            # The memory envelope: session cap × small QUIC flow-control
            # windows, with the Go runtime held below the container limit.
            - name: MAX_SESSIONS
              value: "4000"
            - name: GOMEMLIMIT
              value: "750MiB"
            - name: OIDC_ISSUER
              value: "https://guardianintelligence.org/realms/guardianintelligence.org"
            - name: OIDC_CLIENT_IDS
              value: "wake-up-mythra,mythra-loadgen"
            # Flips to "true" once the realm can issue email_verified
            # (needs SMTP — docs/wake-up-mythra-development.md gaps).
            - name: REQUIRE_EMAIL_VERIFIED
              value: "false"
            # Journal credentials arrive as a mounted file, not env, so
            # rotation rides the kubelet Secret sync and this Deployment
            # stays reloader-free (the hot-reload doctrine above).
            - name: PG_PASSWORD_FILE
              value: /etc/mythra/pg/mythra
            - name: WT_PORT
              value: "4433"
            - name: HTTP_PORT
              value: "9634"
            - name: METRICS_PORT
              value: "9633"
            - name: PUBLIC_ADDR
              value: "wt.wakeupmythra.com:4433" # DNS-only record -> ash-earth
            - name: TLS_CERT_FILE
              value: /etc/mythra/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/mythra/tls/tls.key
            - name: ALLOWED_ORIGINS
              value: "https://wakeupmythra.com"
            - name: BEHAVIOR_DIR
              value: /etc/mythra/behavior
            - name: ASSET_DIR
              value: /etc/mythra/assets
          ports:
            - name: wt
              containerPort: 4433
              protocol: UDP
            - name: http
              containerPort: 9634
              protocol: TCP
            - name: metrics
              containerPort: 9633
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: behavior
              mountPath: /etc/mythra/behavior
              readOnly: true
            - name: assets
              mountPath: /etc/mythra/assets
              readOnly: true
            - name: wt-tls
              mountPath: /etc/mythra/tls
              readOnly: true
            - name: pg-credentials
              mountPath: /etc/mythra/pg
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
              ephemeral-storage: 512Mi
      volumes:
        - name: behavior
          configMap:
            name: mythra-behavior
        - name: assets
          configMap:
            name: mythra-assets
        # optional: the pod runs on the self-signed fallback until the first
        # ACME issuance lands; the server hot-loads the real cert on arrival.
        - name: wt-tls
          secret:
            secretName: mythra-wt-tls
            optional: true
        # optional: hellos answer "park unavailable" until the products
        # Postgres mints the mythra credentials; the journal retries.
        - name: pg-credentials
          secret:
            secretName: postgres-products-credentials
            items:
              - key: mythra
                path: mythra
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: mythrad
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: mythrad
    app.kubernetes.io/part-of: guardian
    guardian.dev/product: mythra
    guardian.dev/stage: prod
spec:
  selector:
    app.kubernetes.io/component: mythrad
  ports:
    - name: http
      port: 80
      targetPort: 9634
      protocol: TCP
    - name: wt
      port: 4433
      targetPort: 4433
      protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: mythrad-metrics
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: mythrad
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: guardian
    guardian.dev/stage: prod
spec:
  selector:
    app.kubernetes.io/component: mythrad
  ports:
    - name: metrics
      port: 9633
      targetPort: 9633
      protocol: TCP
---
# The product apex, path-routed: the web app owns "/" (the page and its
# /static/ chunks); the game service keeps only its API paths. Connected
# sessions never touch "/" — flipping either backend never interrupts play.
# A dedicated Ingress keeps this zone's Origin CA and AOP mTLS gate
# isolated - same as rumi.engineering.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mythra-apex
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: mythrad
    app.kubernetes.io/part-of: guardian
    guardian.dev/product: mythra
    guardian.dev/stage: prod
  annotations:
    # Cloudflare terminates public TLS and proves itself to the origin via
    # AOP mTLS; the origin-pull CA Secret already lives in this namespace
    # (company kustomization). Only verified-edge fetches reach the backend.
    nginx.ingress.kubernetes.io/auth-tls-secret: tenant-guardian-prod/cloudflare-origin-pull-ca
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: tenant-root
  # wakeupmythra.com is not covered by the controller's default certificate
  # (the guardianintelligence.org Origin CA cert); this tls block registers
  # the zone's ACME-issued leaf for SNI selection.
  tls:
    - hosts:
        - wakeupmythra.com
      secretName: mythra-origin-tls
  rules:
    - host: wakeupmythra.com
      http:
        paths:
          - path: /session
            pathType: Prefix
            backend:
              service:
                name: mythrad
                port:
                  number: 80
          - path: /wt-info
            pathType: Prefix
            backend:
              service:
                name: mythrad
                port:
                  number: 80
          - path: /behavior
            pathType: Prefix
            backend:
              service:
                name: mythrad
                port:
                  number: 80
          - path: /assets
            pathType: Prefix
            backend:
              service:
                name: mythrad
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wake-up-mythra-web
                port:
                  number: 80
