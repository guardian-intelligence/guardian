apiVersion: apps/v1
kind: Deployment
metadata:
  name: mythrad
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: mythrad
    app.kubernetes.io/part-of: guardian
    app.kubernetes.io/component: mythrad
    guardian.dev/product: mythra
    guardian.dev/stage: prod
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mythrad
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mythrad
        app.kubernetes.io/part-of: guardian
        app.kubernetes.io/component: mythrad
        guardian.dev/product: mythra
        guardian.dev/stage: prod
        guardian.dev/otel: producer
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      priorityClassName: guardian-standard
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: ash-earth
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mythrad
          image: ghcr.io/guardian-intelligence/mythrad:edge@sha256:03cff9b7af909e4552e84b3663b0348831cc7a5c51a480bcd67e95d3280c5f40 # {"$imagepolicy": "guardian-imageops:mythrad"}
          env:
            - name: MAX_SESSIONS
              value: "4000"
            - name: GOMEMLIMIT
              value: "750MiB"
            - name: OIDC_ISSUER
              value: "https://auth.wakeupmythra.com/realms/wakeupmythra.com"
            - name: OIDC_JWKS_URL
              value: "http://keycloak.tenant-guardian-prod.svc/realms/wakeupmythra.com/protocol/openid-connect/certs"
            - name: OIDC_CLIENT_IDS
              value: "wake-up-mythra"
            - name: REQUIRE_EMAIL_VERIFIED
              value: "false"
            - name: PARKS
              value: "park-mythra"
            - name: PG_PASSWORD_FILE
              value: /etc/mythra/pg/mythra
            - name: WT_PORT
              value: "4433"
            - name: HTTP_PORT
              value: "9634"
            - name: METRICS_PORT
              value: "9633"
            - name: PUBLIC_ADDR
              value: "wt.wakeupmythra.com:4433"
            - name: TLS_CERT_FILE
              value: /etc/mythra/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/mythra/tls/tls.key
            - name: ALLOWED_ORIGINS
              value: "https://wakeupmythra.com"
            - name: BEHAVIOR_DIR
              value: /etc/mythra/behavior
            - name: ASSET_DIR
              value: /etc/mythra/assets
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "otel-collector.guardian-analytics.svc.cozy.local:4317"
          ports:
            - name: wt
              containerPort: 4433
              protocol: UDP
            - name: http
              containerPort: 9634
              protocol: TCP
            - name: metrics
              containerPort: 9633
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: behavior
              mountPath: /etc/mythra/behavior
              readOnly: true
            - name: assets
              mountPath: /etc/mythra/assets
              readOnly: true
            - name: wt-tls
              mountPath: /etc/mythra/tls
              readOnly: true
            - name: pg-credentials
              mountPath: /etc/mythra/pg
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
              ephemeral-storage: 512Mi
      volumes:
        - name: behavior
          configMap:
            name: mythra-behavior
        - name: assets
          configMap:
            name: mythra-assets
        - name: wt-tls
          secret:
            secretName: mythra-wt-tls
            optional: true
        - name: pg-credentials
          secret:
            secretName: postgres-products-credentials
            items:
              - key: mythra
                path: mythra
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: mythrad
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: mythrad
    app.kubernetes.io/part-of: guardian
    guardian.dev/product: mythra
    guardian.dev/stage: prod
spec:
  selector:
    app.kubernetes.io/component: mythrad
  ports:
    - name: http
      port: 80
      targetPort: 9634
      protocol: TCP
    - name: wt
      port: 4433
      targetPort: 4433
      protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: mythrad-metrics
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: mythrad
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: guardian
    guardian.dev/stage: prod
spec:
  selector:
    app.kubernetes.io/component: mythrad
  ports:
    - name: metrics
      port: 9633
      targetPort: 9633
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mythra-apex
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: mythrad
    app.kubernetes.io/part-of: guardian
    guardian.dev/product: mythra
    guardian.dev/stage: prod
  annotations:
    nginx.ingress.kubernetes.io/auth-tls-secret: tenant-guardian-prod/cloudflare-origin-pull-ca
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: tenant-root
  tls:
    - hosts:
        - wakeupmythra.com
      secretName: mythra-origin-tls
  rules:
    - host: wakeupmythra.com
      http:
        paths:
          - path: /session
            pathType: Prefix
            backend:
              service:
                name: mythrad
                port:
                  number: 80
          - path: /wt-info
            pathType: Prefix
            backend:
              service:
                name: mythrad
                port:
                  number: 80
          - path: /behavior
            pathType: Prefix
            backend:
              service:
                name: mythrad
                port:
                  number: 80
          - path: /assets
            pathType: Prefix
            backend:
              service:
                name: mythrad
                port:
                  number: 80
          - path: /terrain
            pathType: Prefix
            backend:
              service:
                name: mythrad
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wake-up-mythra-web
                port:
                  number: 80
