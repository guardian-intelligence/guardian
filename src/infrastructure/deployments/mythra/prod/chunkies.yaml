apiVersion: apps/v1
kind: Deployment
metadata:
  name: chunkies-gateway
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: chunkies-gateway
    app.kubernetes.io/part-of: guardian
    app.kubernetes.io/component: gateway
    guardian.dev/product: mythra
    guardian.dev/stage: prod
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chunkies-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chunkies-gateway
        app.kubernetes.io/part-of: guardian
        app.kubernetes.io/component: gateway
        guardian.dev/product: mythra
        guardian.dev/stage: prod
        guardian.dev/otel: producer
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      priorityClassName: guardian-standard
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: ash-worker0
      tolerations:
        - key: guardian.dev/dedicated
          operator: Equal
          value: wum
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/guardian-intelligence/chunkies-gateway:edge@sha256:a895229698c1325e9f115eaeefbf78fbc4d7dd514b65377251ef85cfe97d70fe # {"$imagepolicy": "guardian-imageops:chunkies-gateway"}
          env:
            - name: MAX_SESSIONS
              value: "4000"
            - name: GOMEMLIMIT
              value: 800MiB
            - name: OIDC_ISSUER
              value: https://auth.wakeupmythra.com/realms/wakeupmythra.com
            - name: OIDC_JWKS_URL
              value: http://keycloak.tenant-guardian-prod.svc/realms/wakeupmythra.com/protocol/openid-connect/certs
            - name: OIDC_CLIENT_IDS
              value: wake-up-mythra
            - name: REQUIRE_EMAIL_VERIFIED
              value: "false"
            - name: GAME
              value: wum
            - name: CHUNK_DIRECTORY_FILE
              value: /etc/chunkies/directory/chunks.conf
            - name: PARK_HTTP_URL
              value: http://127.0.0.1:9631
            - name: INTERNAL_KEY_FILE
              value: /etc/chunkies/internal/password
            - name: TICKET_KEY_FILE
              value: /etc/chunkies/ticket/password
            - name: WT_PORT
              value: "4433"
            - name: HTTP_PORT
              value: "9634"
            - name: METRICS_PORT
              value: "9633"
            - name: PUBLIC_ADDR
              value: wt.wakeupmythra.com:4433
            - name: TLS_CERT_FILE
              value: /etc/mythra/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/mythra/tls/tls.key
            - name: ALLOWED_ORIGINS
              value: https://wakeupmythra.com
            - name: BEHAVIOR_DIR
              value: /etc/mythra/behavior
            - name: ASSET_DIR
              value: /etc/mythra/assets
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: otel-collector.guardian-analytics.svc.cozy.local:4317
          ports:
            - name: wt
              containerPort: 4433
              protocol: UDP
            - name: http
              containerPort: 9634
              protocol: TCP
            - name: metrics
              containerPort: 9633
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "2"
              memory: 1Gi
              ephemeral-storage: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: behavior
              mountPath: /etc/mythra/behavior
              readOnly: true
            - name: assets
              mountPath: /etc/mythra/assets
              readOnly: true
            - name: wt-tls
              mountPath: /etc/mythra/tls
              readOnly: true
            - name: internal-key
              mountPath: /etc/chunkies/internal
              readOnly: true
            - name: ticket-key
              mountPath: /etc/chunkies/ticket
              readOnly: true
            - name: chunk-directory
              mountPath: /etc/chunkies/directory
              readOnly: true
      volumes:
        - name: behavior
          configMap:
            name: mythra-behavior
        - name: assets
          configMap:
            name: mythra-assets
        - name: wt-tls
          secret:
            secretName: mythra-wt-tls
        - name: internal-key
          secret:
            secretName: chunkies-internal-key
        - name: chunk-directory
          configMap:
            name: chunkies-directory
        - name: ticket-key
          secret:
            secretName: chunkies-ticket-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chunkies-park
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: chunkies-park
    app.kubernetes.io/part-of: guardian
    app.kubernetes.io/component: park
    guardian.dev/product: mythra
    guardian.dev/stage: prod
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chunkies-park
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chunkies-park
        app.kubernetes.io/part-of: guardian
        app.kubernetes.io/component: park
        guardian.dev/product: mythra
        guardian.dev/stage: prod
        guardian.dev/otel: producer
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      priorityClassName: guardian-standard
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: ash-worker0
      tolerations:
        - key: guardian.dev/dedicated
          operator: Equal
          value: wum
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: park
          image: ghcr.io/guardian-intelligence/chunkies-park:edge@sha256:b3e2cced8914c887b8070cb2f757cd1a255d4e9d9a82af8eacb7faa1d83177b7 # {"$imagepolicy": "guardian-imageops:chunkies-park"}
          env:
            - name: PARK_NAME
              value: park-mythra
            - name: INTERNAL_HOST
              value: 127.0.0.1
            - name: MAX_SESSIONS
              value: "4000"
            - name: GOMEMLIMIT
              value: 3500MiB
            - name: PARK_PORT
              value: "9632"
            - name: HTTP_PORT
              value: "9631"
            - name: METRICS_PORT
              value: "9637"
            - name: INTERNAL_KEY_FILE
              value: /etc/chunkies/internal/password
            - name: PG_PASSWORD_FILE
              value: /etc/mythra/pg/mythra
            - name: BEHAVIOR_DIR
              value: /etc/mythra/behavior
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: otel-collector.guardian-analytics.svc.cozy.local:4317
          ports:
            - name: metrics
              containerPort: 9637
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "4"
              memory: 4Gi
              ephemeral-storage: 128Mi
            limits:
              cpu: "4"
              memory: 4Gi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: behavior
              mountPath: /etc/mythra/behavior
              readOnly: true
            - name: internal-key
              mountPath: /etc/chunkies/internal
              readOnly: true
            - name: pg-credentials
              mountPath: /etc/mythra/pg
              readOnly: true
      volumes:
        - name: behavior
          configMap:
            name: mythra-behavior
        - name: internal-key
          secret:
            secretName: chunkies-internal-key
        - name: pg-credentials
          secret:
            secretName: postgres-products-credentials
            items:
              - key: mythra
                path: mythra
---
apiVersion: v1
kind: Service
metadata:
  name: chunkies-gateway
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: chunkies-gateway
    app.kubernetes.io/part-of: guardian
    guardian.dev/product: mythra
    guardian.dev/stage: prod
spec:
  selector:
    app.kubernetes.io/name: chunkies-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: wt
      port: 4433
      targetPort: wt
      protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: chunkies-gateway-metrics
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: chunkies-gateway
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: guardian
    guardian.dev/product: mythra
    guardian.dev/stage: prod
spec:
  selector:
    app.kubernetes.io/name: chunkies-gateway
  ports:
    - name: metrics
      port: 9633
      targetPort: metrics
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: chunkies-park-metrics
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: chunkies-park
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: guardian
    guardian.dev/product: mythra
    guardian.dev/stage: prod
spec:
  selector:
    app.kubernetes.io/name: chunkies-park
  ports:
    - name: metrics
      port: 9637
      targetPort: metrics
      protocol: TCP
---
# The chunk directory: which (game, chunk) pairs exist and where their
# authorities listen. The gateway hot-reloads this file — park topology
# changes must never restart the process holding live player sessions.
apiVersion: v1
kind: ConfigMap
metadata:
  name: chunkies-directory
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: chunkies-gateway
    app.kubernetes.io/part-of: guardian
    guardian.dev/product: mythra
    guardian.dev/stage: prod
data:
  chunks.conf: |
    wum park-mythra 127.0.0.1:9632
