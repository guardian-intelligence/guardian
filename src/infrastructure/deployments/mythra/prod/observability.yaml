apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: chunkies-gateway
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: chunkies-gateway
    app.kubernetes.io/part-of: guardian
    guardian.dev/stage: prod
spec:
  namespaceSelector:
    matchNames:
      - tenant-guardian-prod
  selector:
    matchLabels:
      app.kubernetes.io/name: chunkies-gateway
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: chunkies-park
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: chunkies-park
    app.kubernetes.io/part-of: guardian
    guardian.dev/stage: prod
spec:
  namespaceSelector:
    matchNames:
      - tenant-guardian-prod
  selector:
    matchLabels:
      app.kubernetes.io/name: chunkies-park
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: mythrad
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: mythrad
    app.kubernetes.io/part-of: guardian
    guardian.dev/stage: prod
spec:
  namespaceSelector:
    matchNames:
      - tenant-guardian-prod
  selector:
    matchLabels:
      app.kubernetes.io/name: mythrad
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: mythrad
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: mythrad
    app.kubernetes.io/part-of: guardian
    guardian.dev/stage: prod
spec:
  groups:
    - name: mythrad
      rules:
        - alert: MythradScrapeDown
          expr: sum(up{namespace="tenant-guardian-prod",job="mythrad-metrics"}) < 1 or absent(up{namespace="tenant-guardian-prod",job="mythrad-metrics"})
          for: 5m
          labels:
            severity: warning
            guardian_stage: prod
          annotations:
            summary: "mythrad metrics scrape is down"
            description: "No mythrad replica has been scrapeable for five minutes; every other mythrad rule is blind while this fires."
        - alert: MythradTickBudgetExceeded
          expr: histogram_quantile(0.99, sum(rate(mythra_tick_duration_seconds_bucket{job="mythrad-metrics"}[5m])) by (le)) > 0.035
          for: 10m
          labels:
            severity: warning
            guardian_stage: prod
          annotations:
            summary: "mythrad tick p99 above 35ms"
            description: "Authority tick p99 (validation + batch append + fan-out) is converging on the 41.7ms budget at 24Hz."
        - alert: MythradJournalAppendErrors
          expr: increase(mythra_journal_append_errors_total{job="mythrad-metrics"}[10m]) > 0
          labels:
            severity: warning
            guardian_stage: prod
          annotations:
            summary: "mythrad journal appends are failing"
            description: "Each failure closes the affected park authority for a journal-clean reopen (durable-before-visible); sustained failures mean the products Postgres is unhealthy or the mythra credentials are wrong."
        - alert: MythradIntentRejectSpike
          expr: sum(increase(mythra_intents_rejected_total{job="mythrad-metrics"}[15m])) by (reason) > 20
          labels:
            severity: warning
            guardian_stage: prod
          annotations:
            summary: "mythrad rejecting intents ({{ $labels.reason }})"
            description: "More than 20 intents rejected for one reason in 15m. A sustained absent/not_yours stream means players are stuck outside the park (the refresh-rejoin failure mode); encoding/kind means a client-server protocol skew."
        - alert: MythradBehaviorReloadRejected
          expr: increase(mythra_behavior_reloads_total{job="mythrad-metrics",result="error"}[10m]) > 0
          labels:
            severity: warning
            guardian_stage: prod
          annotations:
            summary: "mythrad rejected a behavior module"
            description: "A live or shadow wasm module failed to load; the previous module keeps running. Check mythrad logs for the load error."
    - name: chunkies
      rules:
        - alert: ChunkiesGatewayScrapeDown
          expr: sum(up{namespace="tenant-guardian-prod",job="chunkies-gateway-metrics"}) < 1 or absent(up{namespace="tenant-guardian-prod",job="chunkies-gateway-metrics"})
          for: 5m
          labels:
            severity: warning
            guardian_stage: prod
          annotations:
            summary: "chunkies-gateway metrics scrape is down"
            description: "No chunkies-gateway replica has been scrapeable for five minutes."
        - alert: ChunkiesParkScrapeDown
          expr: sum(up{namespace="tenant-guardian-prod",job="chunkies-park-metrics"}) < 1 or absent(up{namespace="tenant-guardian-prod",job="chunkies-park-metrics"})
          for: 5m
          labels:
            severity: warning
            guardian_stage: prod
          annotations:
            summary: "chunkies-park metrics scrape is down"
            description: "No chunkies-park replica has been scrapeable for five minutes."
        - alert: ChunkiesParkTickBudgetExceeded
          expr: histogram_quantile(0.99, sum(rate(mythra_tick_duration_seconds_bucket{job="chunkies-park-metrics"}[5m])) by (le)) > 0.035
          for: 10m
          labels:
            severity: warning
            guardian_stage: prod
          annotations:
            summary: "chunkies-park tick p99 above 35ms"
            description: "Authority tick p99 is approaching the 41.7ms budget at 24Hz."
        - alert: ChunkiesParkJournalAppendErrors
          expr: increase(mythra_journal_append_errors_total{job="chunkies-park-metrics"}[10m]) > 0
          labels:
            severity: warning
            guardian_stage: prod
          annotations:
            summary: "chunkies-park journal appends are failing"
            description: "The park closed authority after a journal append failure."
        - alert: ChunkiesParkIntentRejectSpike
          expr: sum(increase(mythra_intents_rejected_total{job="chunkies-park-metrics"}[15m])) by (reason) > 20
          labels:
            severity: warning
            guardian_stage: prod
          annotations:
            summary: "chunkies-park rejecting intents ({{ $labels.reason }})"
            description: "More than 20 intents were rejected for one reason in 15 minutes."
        - alert: ChunkiesParkBehaviorReloadRejected
          expr: increase(mythra_behavior_reloads_total{job="chunkies-park-metrics",result="error"}[10m]) > 0
          labels:
            severity: warning
            guardian_stage: prod
          annotations:
            summary: "chunkies-park rejected a behavior module"
            description: "A behavior module failed to load; the previous module remains active."
