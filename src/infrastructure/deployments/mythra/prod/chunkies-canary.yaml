apiVersion: batch/v1
kind: Job
metadata:
  name: chunkies-loadgen-canary
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: chunkies-loadgen-canary
    app.kubernetes.io/part-of: guardian
    app.kubernetes.io/component: mythrad-loadgen
    guardian.dev/product: mythra
    guardian.dev/stage: prod
spec:
  activeDeadlineSeconds: 660
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chunkies-loadgen-canary
        app.kubernetes.io/part-of: guardian
        app.kubernetes.io/component: mythrad-loadgen
        guardian.dev/product: mythra
        guardian.dev/stage: prod
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          image: ghcr.io/guardian-intelligence/chunkies-gateway:edge@sha256:3c4083f4d4390036ace741520dc946cd2aad49da23100c6586e3c9bb065137e6
          command: ["/app/loadgen"]
          env:
            - name: TARGET_URL
              value: https://206.223.228.99:4433/wt
            - name: SESSION_URL
              value: http://chunkies-gateway.tenant-guardian-prod.svc/session
            - name: TOKEN_URL
              value: http://keycloak.tenant-guardian-prod.svc/realms/wakeupmythra.com/protocol/openid-connect/token
            - name: CLIENT_SECRET_FILE
              value: /etc/loadgen/client-secret
            - name: SESSIONS
              value: "200"
            - name: PARKS
              value: "1"
            - name: PARK_NAME
              value: park-chunkies-canary
            - name: RAMP_RATE
              value: "50"
            - name: HOLD_SEC
              value: "300"
            - name: ACT_SEC
              value: "15"
            - name: VM_IMPORT_URL
              value: http://vminsert-shortterm.tenant-root.svc:8480/insert/0/prometheus/api/v1/import/prometheus?extra_label=run_source%3Dchunkies_dark_canary&extra_label=surface%3Dmythra
          volumeMounts:
            - name: client-secret
              mountPath: /etc/loadgen
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: client-secret
          secret:
            secretName: keycloak-mythra-loadgen-client
            items:
              - key: password
                path: client-secret
