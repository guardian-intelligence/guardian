apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  # The reviewable definition of what Guardian releases
  # (release-manifest.yaml header). Rendering it keeps its refs visible to
  # the imageset extractor, so released digests ride the union lock and the
  # dark haul.
  - name: release-manifest
    namespace: tenant-guardian
    files:
      - release-manifest.yaml
resources:
  - stage-tenants.yaml
  - openbao-listener-tls.yaml
  - openbao-helmrelease.yaml
  - openbao-networkpolicy.yaml
  - openbao-observability.yaml
  - openbao-rbac.yaml
  - storage-encryption-canary.yaml
  - vap-denial-canary.yaml
  - zot-helmrelease.yaml
  - zot-mirror-canary.yaml
  - zot-networkpolicy.yaml
  - zot-observability.yaml
