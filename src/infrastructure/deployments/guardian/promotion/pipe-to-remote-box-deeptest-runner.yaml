apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: pipe-to-remote-box-deeptest-runner
  namespace: guardian-analytics
  labels:
    app.kubernetes.io/name: pipe-to-remote-box-deeptest-runner
    app.kubernetes.io/part-of: guardian
spec:
  groups:
    - name: pipe-to-remote-box-deeptest-runner.rules
      interval: 60s
      rules:
        - alert: GuardianPipeToRemoteBoxDeeptestSilent
          expr: >-
            absent_over_time(guardian_pipe_to_remote_box_deeptest_heartbeat[3h])
            and on() (time() - max(kube_cronjob_status_last_schedule_time{
              namespace="guardian-analytics", cronjob="pipe-to-remote-box-deeptest-runner"}) > 1800)
          labels:
            severity: warning
            guardian_component: pipe-to-remote-box-release-train
          annotations:
            summary: "Pipe to Remote Box deep test has been silent for 3h"
            description: >-
              No deep-test heartbeat has arrived. Check the newest
              pipe-to-remote-box-deeptest-runner Job in guardian-analytics.
        - alert: GuardianPipeToRemoteBoxDeeptestFailing
          expr: >-
            last_over_time(guardian_pipe_to_remote_box_deeptest_pass[90m]) == 0
            and on(digest)
            (last_over_time(guardian_pipe_to_remote_box_deeptest_edge_seen_seconds[90m])
            == scalar(max(last_over_time(guardian_pipe_to_remote_box_deeptest_edge_seen_seconds[90m]))))
          labels:
            severity: warning
            guardian_component: pipe-to-remote-box-release-train
          annotations:
            summary: "Pipe to Remote Box edge digest failed its deep test"
            description: >-
              The exact digest currently eligible for nightly promotion has a
              failing verdict. guardian_pipe_to_remote_box_deeptest_check names
              the failed invariant; Kargo will not advance this digest.
