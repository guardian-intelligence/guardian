# The postflight CLI ships to users through release channels, not clusters:
# promoting this stage advances the nightly pin in the CLI's channels file,
# which the in-cluster release reconciler turns into a GitHub Release carrying
# the build-time signatures (nothing is re-signed on promotion).
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: postflight-cli-nightly
  namespace: guardian-products
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: postflight-cli
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: repoURL
          value: https://github.com/guardian-intelligence/guardian.git
        - name: imageRepo
          value: ghcr.io/guardian-intelligence/postflight-cli
        - name: vmQueryURL
          value: http://vmselect-shortterm.tenant-root.svc:8481/select/0/prometheus/api/v1/query
      steps:
        # The deep test's verdict belongs to the digest, not to the clock, so
        # this asks for the answer to the exact digest being promoted rather
        # than for a recent one. successExpression and failureExpression are
        # complements over a result that exists: a definitive 0 fails the
        # promotion terminally, while a digest that has no verdict yet — one
        # built between the runner's last hourly pass and 08:00 — satisfies
        # neither and the step retries until the next run adjudicates it. No
        # data is not bad data. The budget spans a full runner cadence and
        # stays under the 30 minutes at which KargoPromotionStuck warns.
        - uses: http
          as: check-deeptest-pass
          retry:
            timeout: 28m
          config:
            method: GET
            url: ${{ vars.vmQueryURL }}
            queryParams:
              - name: query
                value: last_over_time(guardian_cli_deeptest_pass{digest="${{ imageFrom(vars.imageRepo).Digest }}"}[3h])
            successExpression: len(response.body.data.result) > 0 && float(response.body.data.result[0].value[1]) == 1.0
            failureExpression: len(response.body.data.result) > 0 && float(response.body.data.result[0].value[1]) != 1.0
        - uses: git-clone
          config:
            repoURL: ${{ vars.repoURL }}
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          config:
            path: ./repo/src/postflight/cli/release/channels.yaml
            updates:
              - key: channels.nightly.image
                value: ${{ vars.imageRepo }}@${{ imageFrom(vars.imageRepo).Digest }}
        # The release manifest's lane moves in the same commit as the channel
        # pin — that is what puts the digest under the countersigner and the
        # release projector; TestReleaseManifestCoversReleaseChannels keeps
        # the PR red otherwise.
        - uses: yaml-update
          config:
            path: ./repo/src/infrastructure/deployments/guardian/system/release-manifest.yaml
            updates:
              - key: releases.postflight-cli.nightly.image
                value: ${{ vars.imageRepo }}@${{ imageFrom(vars.imageRepo).Digest }}
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: promote postflight-cli (nightly) to ${{ imageFrom(vars.imageRepo).Digest }}
        # The pin lands on main directly through the ruleset's bot bypass —
        # the same path Flux image automation walks for workload pins. A pin
        # move is not a content change: every digest it can write has already
        # passed the merge gate and the deep-test gate above, and the
        # conformance suite re-checks the channel/manifest pairing
        # loud-after-merge on main. A non-fast-forward race against a
        # concurrent merge fails the promotion; the promoter's retry cadence
        # rebuilds it from a fresh clone.
        - uses: git-push
          config:
            path: ./repo
