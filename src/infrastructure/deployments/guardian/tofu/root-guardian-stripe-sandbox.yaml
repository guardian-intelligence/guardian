# guardian-stripe-sandbox — the first root reconciled in-cluster
# (docs/tofu-gitops-design.md): sandbox blast radius, no variables, one
# provider credential. approvePlan starts empty on purpose — the plan-only
# soak: the controller plans on every drift interval and holds, the plan
# lands in a Secret (storeReadablePlan: json; the read persona can read
# ConfigMaps, so never "human" mode), and the flip to auto is its own
# reviewed PR once the soak shows clean, stable plans.
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: guardian-stripe-sandbox
  namespace: tofu-system
  labels:
    app.kubernetes.io/name: tofu-controller
    app.kubernetes.io/part-of: guardian
spec:
  interval: 1h
  retryInterval: 2m
  path: ./src/infrastructure/bootstrap/guardian-stripe-sandbox
  sourceRef:
    kind: ${GUARDIAN_SOURCE_KIND:=GitRepository}
    name: ${GUARDIAN_SOURCE_NAME:=guardian}
    namespace: cozy-fluxcd
  storeReadablePlan: json
  runnerPodTemplate:
    spec:
      envFrom:
        - secretRef:
            name: tofu-backend-r2
        - secretRef:
            name: tofu-state-encryption
        - secretRef:
            name: tofu-stripe
