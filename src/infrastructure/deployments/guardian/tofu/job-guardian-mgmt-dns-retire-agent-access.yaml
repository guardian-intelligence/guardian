# One-time, Flux-managed apply of guardian-mgmt-dns that retires the Codex,
# Cursor and Devin cloud-agent cluster transport: their Access service tokens
# (expiring 2026-11-08 and failing the root's 21-day expiry postcondition),
# their non_identity policies, the k8s-codex Access application, its DNS
# record and its Tunnel ingress rule. The Tunnel and the operator routes stay.
# The root stays plan-only; the runner applies only its saved plan, targeted
# at those resources. No TTL: remove this completed Job through Git after the
# root's scheduled plan reads back clean.
apiVersion: batch/v1
kind: Job
metadata:
  name: tofu-guardian-mgmt-dns-retire-agent-access
  namespace: tofu-system
  labels:
    app.kubernetes.io/name: tofu-runner
    app.kubernetes.io/part-of: guardian
    guardian.dev/tofu-root: guardian-mgmt-dns
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 3000
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tofu-runner
        guardian.dev/tofu-root: guardian-mgmt-dns
    spec:
      serviceAccountName: tofu-runner
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tofu
          image: ghcr.io/guardian-intelligence/tofu-runner:edge@sha256:d4ad2575dc8f802a953721aca74ff14b771f0957bd04424beba6b2384bc8ee40
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: MODE
              value: apply
            - name: TF_CLI_ARGS_plan
              value: -target=cloudflare_zero_trust_access_application.guardian_codex_cloud -target=cloudflare_zero_trust_access_policy.guardian_codex_cloud -target=cloudflare_zero_trust_access_policy.guardian_cloud_agent -target=cloudflare_zero_trust_access_service_token.guardian_codex_cloud -target=cloudflare_zero_trust_access_service_token.guardian_cloud_agent -target=cloudflare_dns_record.guardian_codex_cloud_k8s_api -target=cloudflare_zero_trust_tunnel_cloudflared_config.guardian_codex_cloud
            - name: ROOT_NAME
              value: guardian-mgmt-dns
            - name: ROOT_PATH
              value: ./src/infrastructure/bootstrap/guardian-mgmt-dns
            - name: SOURCE_KIND
              value: ${GUARDIAN_SOURCE_KIND:=GitRepository}
            - name: SOURCE_NAME
              value: ${GUARDIAN_SOURCE_NAME:=guardian}
            - name: TF_VAR_cloudflare_account_id
              valueFrom:
                configMapKeyRef:
                  name: tofu-vars
                  key: cloudflare_account_id
          envFrom:
            - secretRef:
                name: tofu-backend-r2
            - secretRef:
                name: tofu-state-encryption
            - secretRef:
                name: tofu-cloudflare-dns
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: workspace
          emptyDir: {}
        - name: tmp
          emptyDir: {}
