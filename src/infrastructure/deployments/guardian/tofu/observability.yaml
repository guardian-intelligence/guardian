# Health for the per-root tofu-runner CronJobs. The runner signals purely by
# exit code (docs/tofu-gitops-design.md): a tofu error, a failed apply, or
# drift on the page-on-drift minter fails the Job, and these rules turn that
# into a page — the same posture as the etcd-snapshot CronJob, and the reason
# the runner holds no Alerta credential. Drift on a plan-mode root exits 0 on
# purpose (the soak), so it never reaches these rules; it is read from the
# pod log.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: tofu-runner-health
  namespace: tenant-root
  labels:
    app.kubernetes.io/name: tofu-runner-health
    app.kubernetes.io/part-of: guardian
    guardian.dev/component: alerting
spec:
  groups:
    - name: tofu-runner-health.rules
      interval: 60s
      rules:
        - alert: TofuRootJobFailed
          expr: max by (job_name) (kube_job_status_failed{namespace="tofu-system", job_name=~"tofu-.*"}) > 0
          for: 10m
          labels:
            severity: warning
            guardian_component: iac
          annotations:
            summary: 'tofu root reconcile failed ({{ $labels.job_name }})'
            description: >-
              A tofu-runner Job has failed and no later attempt has replaced
              it. This is a tofu error, a failed apply, or — on the token
              minter — a plan with changes, which for that root means a
              Cloudflare token was minted or revoked out of band. Read the
              Job's pod log and see
              src/infrastructure/runbooks/tofu-runner-operations.md.
        - alert: TofuReconcileStale
          expr: time() - max by (cronjob) (kube_cronjob_status_last_successful_time{namespace="tofu-system"}) > 10800
          for: 15m
          labels:
            severity: warning
            guardian_component: iac
          annotations:
            summary: 'tofu root has not reconciled ({{ $labels.cronjob }})'
            description: >-
              No tofu-runner Job for this root has succeeded in over three
              hours (hourly schedule plus slack). The root is not being
              reconciled from Git; drift would go unseen. Also covers the
              never-succeeded case after first deploy.
        - alert: TofuMinterReconcileStale
          expr: time() - kube_cronjob_status_last_successful_time{namespace="tofu-system", cronjob="tofu-guardian-mgmt-cloudflare-tokens"} > 3600
          for: 15m
          labels:
            severity: critical
            guardian_component: iac
          annotations:
            summary: 'tofu token-minter drift detector is not running'
            description: >-
              The guardian-mgmt-cloudflare-tokens CronJob (15-minute schedule)
              has not succeeded in over an hour. Its plan is the hostile-mint
              detector, so while it is silent a token minted or revoked out of
              band would not be caught. Treat as a security-monitoring outage.
        - alert: TofuMetricsAbsent
          expr: absent(kube_cronjob_status_last_schedule_time{namespace="tofu-system", cronjob="tofu-guardian-mgmt-cloudflare-tokens"})
          for: 30m
          labels:
            severity: critical
            guardian_component: iac
          annotations:
            summary: 'tofu CronJobs missing from metrics'
            description: >-
              kube-state-metrics no longer reports the tofu-system CronJobs:
              either the objects were deleted or KSM is blind, and in both
              cases every tofu-runner-health rule — including the minter drift
              detector — is dark.
