# guardian-mgmt-dns — third of the lane roots to run approvePlan auto,
# behind its guards: prevent_destroy on the ops-access surface, blocking
# preconditions, and the pause procedure runbook. Auto is sound because the
# reconcile loop traverses nothing this root manages; a bad apply cannot
# sever its own revert path.
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: guardian-mgmt-dns
  namespace: tofu-system
  labels:
    app.kubernetes.io/name: tofu-controller
    app.kubernetes.io/part-of: guardian
spec:
  approvePlan: auto
  interval: 1h
  retryInterval: 2m
  path: ./src/infrastructure/bootstrap/guardian-mgmt-dns
  sourceRef:
    kind: ${GUARDIAN_SOURCE_KIND:=GitRepository}
    name: ${GUARDIAN_SOURCE_NAME:=guardian}
    namespace: cozy-fluxcd
  storeReadablePlan: json
  # Outputs carry the Codex tunnel connector token and the per-provider
  # Access service-token secrets; this Secret is the relay hop toward
  # OpenBao and the cloud-agent environments — consumers never read it
  # directly.
  writeOutputsToSecret:
    name: guardian-mgmt-dns-outputs
  varsFrom:
    - kind: ConfigMap
      name: tofu-vars
  runnerPodTemplate:
    spec:
      envFrom:
        - secretRef:
            name: tofu-backend-r2
        - secretRef:
            name: tofu-state-encryption
        - secretRef:
            name: tofu-cloudflare-dns
