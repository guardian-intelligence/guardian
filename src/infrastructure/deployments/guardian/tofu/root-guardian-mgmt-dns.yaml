# guardian-mgmt-dns — flips to auto last of the lane roots in the ruled
# order; its guards (prevent_destroy on the ops-access surface, blocking
# conditions, the pause procedure in tofu-controller-operations.md) landed
# first. Auto is sound because the reconcile loop traverses nothing this
# root manages; a bad apply cannot sever its own revert path. Plan-only
# until the earlier movers' flips are done.
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: guardian-mgmt-dns
  namespace: tofu-system
  labels:
    app.kubernetes.io/name: tofu-controller
    app.kubernetes.io/part-of: guardian
spec:
  interval: 1h
  retryInterval: 2m
  path: ./src/infrastructure/bootstrap/guardian-mgmt-dns
  sourceRef:
    kind: ${GUARDIAN_SOURCE_KIND:=GitRepository}
    name: ${GUARDIAN_SOURCE_NAME:=guardian}
    namespace: cozy-fluxcd
  storeReadablePlan: json
  varsFrom:
    - kind: ConfigMap
      name: tofu-vars
  runnerPodTemplate:
    spec:
      envFrom:
        - secretRef:
            name: tofu-backend-r2
        - secretRef:
            name: tofu-state-encryption
        - secretRef:
            name: tofu-cloudflare-dns
