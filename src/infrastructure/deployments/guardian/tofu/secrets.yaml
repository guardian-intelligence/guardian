# Per-namespace secret scope: the secrets-reader SA is what ESO authenticates
# as (OpenBao role guardian-reader-tofu-system, read-only on this namespace's
# kv subtree); the secrets-writer SA exists only so an operator can mint a
# short-lived token that writes this namespace's subtree and nothing else
# (role guardian-writer-tofu-system). Neither SA automounts; nothing
# schedules as them.
#
# The materialized Secrets feed Terraform CR runner pods as env. Every value
# is reissuable third-party material relayed here during the cutover
# ceremony (custody.md): the R2 state-backend keypair, the state-encryption
# passphrase, and one provider credential per root as it migrates.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-reader
  namespace: tofu-system
  labels:
    app.kubernetes.io/name: tofu-controller
    app.kubernetes.io/part-of: guardian
    guardian.dev/secret-scope: tofu-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-writer
  namespace: tofu-system
  labels:
    app.kubernetes.io/name: tofu-controller
    app.kubernetes.io/part-of: guardian
    guardian.dev/secret-scope: tofu-system
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: tofu-system-openbao
  labels:
    app.kubernetes.io/name: tofu-controller
    app.kubernetes.io/part-of: guardian
    guardian.dev/secret-scope: tofu-system
spec:
  provider:
    vault:
      server: https://guardian-openbao.tenant-guardian.svc:8200
      path: kv
      version: v2
      caProvider:
        type: Secret
        name: guardian-openbao-api-tls
        key: ca.crt
        namespace: tenant-guardian
      auth:
        kubernetes:
          mountPath: kubernetes
          role: guardian-reader-tofu-system
          serviceAccountRef:
            name: secrets-reader
            namespace: tofu-system
            audiences:
              - openbao
---
# The R2 state-backend keypair and endpoint, shared by every root's runner:
# the s3 backend reads standard AWS_* env, and the endpoint rides
# AWS_ENDPOINT_URL_S3 instead of partial init config so the runner needs no
# per-root init arguments.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tofu-backend-r2
  namespace: tofu-system
  labels:
    app.kubernetes.io/name: tofu-controller
    app.kubernetes.io/part-of: guardian
    guardian.dev/secret-scope: tofu-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: tofu-system-openbao
  target:
    name: tofu-backend-r2
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: guardian/guardian-mgmt/tofu-system/backend-r2
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: guardian/guardian-mgmt/tofu-system/backend-r2
        property: AWS_SECRET_ACCESS_KEY
    - secretKey: AWS_ENDPOINT_URL_S3
      remoteRef:
        key: guardian/guardian-mgmt/tofu-system/backend-r2
        property: AWS_ENDPOINT_URL_S3
---
# The state-encryption passphrase, composed into the TF_ENCRYPTION document
# the runner env carries (versions.tf key_provider "pbkdf2" "state" — the
# label must match). The raw passphrase is the OpenBao value; its
# disaster-recovery twin lives in the operator vault (dual-homed on
# purpose: the cluster serves runners, the vault serves cold boot).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tofu-state-encryption
  namespace: tofu-system
  labels:
    app.kubernetes.io/name: tofu-controller
    app.kubernetes.io/part-of: guardian
    guardian.dev/secret-scope: tofu-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: tofu-system-openbao
  target:
    name: tofu-state-encryption
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      data:
        TF_ENCRYPTION: '{"key_provider":{"pbkdf2":{"state":{"passphrase":"{{ .passphrase }}"}}}}'
  data:
    - secretKey: passphrase
      remoteRef:
        key: guardian/guardian-mgmt/tofu-system/state-encryption
        property: passphrase
---
# guardian-stripe-sandbox runner credential (first mover).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tofu-stripe
  namespace: tofu-system
  labels:
    app.kubernetes.io/name: tofu-controller
    app.kubernetes.io/part-of: guardian
    guardian.dev/secret-scope: tofu-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: tofu-system-openbao
  target:
    name: tofu-stripe
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
  data:
    - secretKey: STRIPE_API_KEY
      remoteRef:
        key: guardian/guardian-mgmt/tofu-system/stripe
        property: STRIPE_API_KEY
---
# guardian-mgmt-edge-policy runner credential: the edge-policy provisioner
# lane token (zone policy writes only, cannot move traffic).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tofu-cloudflare-edge-policy
  namespace: tofu-system
  labels:
    app.kubernetes.io/name: tofu-controller
    app.kubernetes.io/part-of: guardian
    guardian.dev/secret-scope: tofu-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: tofu-system-openbao
  target:
    name: tofu-cloudflare-edge-policy
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
  data:
    - secretKey: CLOUDFLARE_API_TOKEN
      remoteRef:
        key: guardian/guardian-mgmt/tofu-system/cloudflare-edge-policy
        property: CLOUDFLARE_API_TOKEN
