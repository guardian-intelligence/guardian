# One-time, Flux-managed apply for the verified Postflight checkout allowance.
# Keep the scheduled guardian-github root in full plan mode: its unrelated
# ruleset/fleet changes are outside this bootstrap. OpenTofu targeting here
# is temporary and exceptional; the runner applies only its saved tfplan.
# The c9c8ed41 plan imported one resource and added only the reviewed action
# digest. The scheduled root continues to expose its complete, unapplied plan.
# No TTL: Flux would recreate a deleted completed Job. Remove this manifest
# through Git after verified policy convergence. The image pin is deliberately
# fixed because a Job's pod template cannot follow image automation in place.
apiVersion: batch/v1
kind: Job
metadata:
  name: tofu-guardian-github-actions-apply
  namespace: tofu-system
  labels:
    app.kubernetes.io/name: tofu-runner
    app.kubernetes.io/part-of: guardian
    guardian.dev/tofu-root: guardian-github
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 3000
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tofu-runner
        guardian.dev/tofu-root: guardian-github
    spec:
      serviceAccountName: tofu-runner
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tofu
          image: ghcr.io/guardian-intelligence/tofu-runner:edge@sha256:937a7839ebe4a4dd7e4dadb84eab7b5c46494555a31f3f484d402a87c3cd05d3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: MODE
              value: apply
            - name: TF_CLI_ARGS_plan
              value: -target=github_actions_repository_permissions.guardian
            - name: ROOT_NAME
              value: guardian-github
            - name: ROOT_PATH
              value: ./src/infrastructure/bootstrap/guardian-github
            - name: SOURCE_KIND
              value: ${GUARDIAN_SOURCE_KIND:=GitRepository}
            - name: SOURCE_NAME
              value: ${GUARDIAN_SOURCE_NAME:=guardian}
          envFrom:
            - secretRef:
                name: tofu-backend-r2
            - secretRef:
                name: tofu-state-encryption
            - secretRef:
                name: tofu-github
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: workspace
          emptyDir: {}
        - name: tmp
          emptyDir: {}
