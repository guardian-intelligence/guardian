# One-time, Flux-managed apply for the corrected Postflight checkout allowance.
# The reviewed plan changes only github_actions_repository_permissions.guardian.
# Keep the scheduled full root in plan mode; its unrelated drift is not part of
# this migration. The runner applies only its saved targeted tfplan.
# No TTL: remove this completed Job through Git after policy readback.
apiVersion: batch/v1
kind: Job
metadata:
  name: tofu-guardian-github-checkout-cjs-apply
  namespace: tofu-system
  labels:
    app.kubernetes.io/name: tofu-runner
    app.kubernetes.io/part-of: guardian
    guardian.dev/tofu-root: guardian-github
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 3000
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tofu-runner
        guardian.dev/tofu-root: guardian-github
    spec:
      serviceAccountName: tofu-runner
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tofu
          image: ghcr.io/guardian-intelligence/tofu-runner:edge@sha256:97fc090608f392211b91d93d26eedd9c0d6e5740627bd7e9eb1795fe5594ecb5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: MODE
              value: apply
            - name: TF_CLI_ARGS_plan
              value: -target=github_actions_repository_permissions.guardian
            - name: ROOT_NAME
              value: guardian-github
            - name: ROOT_PATH
              value: ./src/infrastructure/bootstrap/guardian-github
            - name: SOURCE_KIND
              value: ${GUARDIAN_SOURCE_KIND:=GitRepository}
            - name: SOURCE_NAME
              value: ${GUARDIAN_SOURCE_NAME:=guardian}
          envFrom:
            - secretRef:
                name: tofu-backend-r2
            - secretRef:
                name: tofu-state-encryption
            - secretRef:
                name: tofu-github
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: workspace
          emptyDir: {}
        - name: tmp
          emptyDir: {}
