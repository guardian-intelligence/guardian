# Egress for the controller and its runner pods. The controller fetches the
# source artifact from the Flux source-controller and streams it to runners
# over gRPC (:30000, controller dials runner), so only the controller needs
# the artifact path; runners need their providers and the R2 state backend —
# world:443 rather than an FQDN allowlist, because toFQDNs needs the L7 DNS
# proxy the chained datapath rules out (same reasoning as the promotion
# lane's policies).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tofu-controller
  namespace: tofu-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tofu-controller
  egress:
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Source artifact tarballs. Cozystack's all-in-one Flux pod runs
    # hostNetwork, and Cilium gives node addresses the host/remote-node
    # reserved identities — an endpoint selector can never match them, so
    # the artifact endpoint (source-controller's http-sc, 9790) is reached
    # by entity.
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9790"
              protocol: TCP
    # Runner gRPC: the controller dials each runner pod it spawns.
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: tf-runner
      toPorts:
        - ports:
            - port: "30000"
              protocol: TCP
---
# Runner pods: spawned by the controller per Terraform CR, labeled
# app.kubernetes.io/name=tf-runner by the controller itself. Providers,
# GitHub, and the R2 state backend are all TLS on 443.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tf-runner
  namespace: tofu-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tf-runner
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: tofu-controller
      toPorts:
        - ports:
            - port: "30000"
              protocol: TCP
  egress:
    # The runner uses in-cluster config: it dials the Kubernetes API for its
    # gRPC mTLS secret and pod identity. The API ClusterIP is not `world`, so
    # it needs the kube-apiserver entity explicitly or the runner wedges at
    # "dial tcp 10.96.0.1:443: i/o timeout" before it ever plans.
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
