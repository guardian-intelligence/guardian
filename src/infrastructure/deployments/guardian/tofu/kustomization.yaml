apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secrets.yaml
  - rbac.yaml
  - networkpolicy.yaml
  - observability.yaml
  - cronjob-guardian-stripe-sandbox.yaml
  - cronjob-guardian-mgmt-edge-policy.yaml
  - cronjob-guardian-github.yaml
  - cronjob-guardian-mgmt-dns.yaml
  - cronjob-guardian-mgmt-cloudflare-tokens.yaml
  - cronjob-guardian-mgmt.yaml

# One copy of the non-secret account id every Cloudflare root's CronJob
# consumes as TF_VAR_cloudflare_account_id; the workstation twin is
# bootstrap/backend.tfvars.
configMapGenerator:
  - name: tofu-vars
    namespace: tofu-system
    literals:
      - cloudflare_account_id=c3eaeffaadf7d4847684d4775c16d598
    options:
      disableNameSuffixHash: true
