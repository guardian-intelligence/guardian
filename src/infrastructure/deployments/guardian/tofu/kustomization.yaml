apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secrets.yaml
  - tofu-controller-helmrelease.yaml
  - tofu-controller-networkpolicy.yaml
  - root-guardian-stripe-sandbox.yaml
  - root-guardian-mgmt-edge-policy.yaml
  - root-guardian-github.yaml
  - root-guardian-mgmt-dns.yaml
  - root-guardian-mgmt-cloudflare-tokens.yaml
  - root-guardian-mgmt.yaml
  - rbac.yaml

# One copy of the non-secret account id every Cloudflare root's CR consumes
# via varsFrom; the workstation twin is bootstrap/backend.tfvars.
configMapGenerator:
  - name: tofu-vars
    namespace: tofu-system
    literals:
      - cloudflare_account_id=c3eaeffaadf7d4847684d4775c16d598
    options:
      disableNameSuffixHash: true
