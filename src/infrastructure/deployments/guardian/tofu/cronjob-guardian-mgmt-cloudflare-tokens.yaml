# guardian-mgmt-cloudflare-tokens — the minter, in-cluster by the informed
# 2026-08-08 ruling. The short schedule is deliberate: this root's drift plan
# is the hostile-mint detector, so it re-plans every 15 minutes. PAGE_ON_DRIFT
# makes a non-empty plan a non-zero exit here even in plan mode — for this
# root drift is not a pending change to soak on but a token minted or revoked
# out of band, so it fails the Job and pages via the tofu-runner-health rule.
# Pod shape mirrors cronjob-guardian-stripe-sandbox.yaml.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tofu-guardian-mgmt-cloudflare-tokens
  namespace: tofu-system
  labels:
    app.kubernetes.io/name: tofu-runner
    app.kubernetes.io/part-of: guardian
    guardian.dev/tofu-root: guardian-mgmt-cloudflare-tokens
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3000
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tofu-runner
            guardian.dev/tofu-root: guardian-mgmt-cloudflare-tokens
        spec:
          serviceAccountName: tofu-runner
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: tofu
              image: ghcr.io/guardian-intelligence/tofu-runner:edge@sha256:e213585f3dbe09312c058118b6574e56af1ff54486cba03734d7670e6f5e3dc2 # {"$imagepolicy": "guardian-imageops:tofu-runner"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              env:
                - name: ROOT_NAME
                  value: guardian-mgmt-cloudflare-tokens
                - name: ROOT_PATH
                  value: ./src/infrastructure/bootstrap/guardian-mgmt-cloudflare-tokens
                - name: SOURCE_KIND
                  value: ${GUARDIAN_SOURCE_KIND:=GitRepository}
                - name: SOURCE_NAME
                  value: ${GUARDIAN_SOURCE_NAME:=guardian}
                - name: PAGE_ON_DRIFT
                  value: "true"
                - name: TF_VAR_cloudflare_account_id
                  valueFrom:
                    configMapKeyRef:
                      name: tofu-vars
                      key: cloudflare_account_id
              envFrom:
                - secretRef:
                    name: tofu-backend-r2
                - secretRef:
                    name: tofu-state-encryption
                - secretRef:
                    name: tofu-cloudflare-minter
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
          volumes:
            - name: workspace
              emptyDir: {}
            - name: tmp
              emptyDir: {}
