# guardian-mgmt — the metal, last of all. prevent_destroy spans every
# server resource, so a destroy plan fails and alerts instead of executing;
# cold boot never meets this CR (no cluster, no controller — the disaster
# path applies from a workstation with operator-vault credentials).
# Plan-only until its turn in the ruled order.
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: guardian-mgmt
  namespace: tofu-system
  labels:
    app.kubernetes.io/name: tofu-controller
    app.kubernetes.io/part-of: guardian
spec:
  interval: 1h
  retryInterval: 2m
  path: ./src/infrastructure/bootstrap/guardian-mgmt
  sourceRef:
    kind: ${GUARDIAN_SOURCE_KIND:=GitRepository}
    name: ${GUARDIAN_SOURCE_NAME:=guardian}
    namespace: cozy-fluxcd
  storeReadablePlan: json
  runnerPodTemplate:
    spec:
      envFrom:
        - secretRef:
            name: tofu-backend-r2
        - secretRef:
            name: tofu-state-encryption
        - secretRef:
            name: tofu-latitude
