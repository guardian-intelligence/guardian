# flagd's own flows. Flag definitions arrive via the ConfigMap mount, not
# the network; beyond DNS the evaluator has no one to call.
# Public ingress arrives with node identity (hostNetwork root ingress) and is
# admitted by the additive CCNP below; selecting only egress here leaves that
# admit intact.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flagd
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: flagd
    app.kubernetes.io/part-of: guardian
    guardian.dev/stage: prod
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: flagd
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# The public edge is the tenant-root ingress controller on the node public
# IPs (Cloudflare origins). It runs hostNetwork, so its traffic arrives with
# the reserved host/remote-node identities — never a pod identity — and the
# admit must be entity-based. Port 8014 is included for the in-cluster
# metrics scrape, which also arrives via vmagent in tenant-root.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: tenant-guardian-prod-allow-root-ingress-flagd
  labels:
    app.kubernetes.io/part-of: guardian
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: In
        values:
          - tenant-guardian-prod
      - key: k8s:app.kubernetes.io/name
        operator: In
        values:
          - flagd
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8016"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tenant-root
      toPorts:
        - ports:
            - port: "8014"
              protocol: TCP
---
# feature-flags-notify: same shape as flagd — the epoch arrives via the
# ConfigMap mount, so beyond DNS there is no egress. 8080 carries the SSE
# stream (public edge, node identity) and the metrics scrape (vmagent).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: feature-flags-notify
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: feature-flags-notify
    app.kubernetes.io/part-of: guardian
    guardian.dev/stage: prod
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: feature-flags-notify
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: tenant-guardian-prod-allow-root-ingress-feature-flags-notify
  labels:
    app.kubernetes.io/part-of: guardian
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: In
        values:
          - tenant-guardian-prod
      - key: k8s:app.kubernetes.io/name
        operator: In
        values:
          - feature-flags-notify
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tenant-root
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
