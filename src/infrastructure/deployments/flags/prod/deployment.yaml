# The client feature-flag control plane: flagd serving OFREP — the
# vendor-neutral OpenFeature HTTP protocol — behind the same-origin
# /features mount. flagd is an implementation detail behind that contract;
# swap it and no client changes. See docs/feature-flags.md.
#
# House philosophy: feature flags are for CLIENTS ONLY. Server binaries are
# never runtime-reconfigured — it is impossible to reason about how a running
# service behaves under a config flip; services change by rolling restart with
# a different OCI, shadow launch, and traffic re-routing. Clients are the
# opposite: they gate UI and pre-GA code paths, so they evaluate against
# this control plane and re-render on flips.
#
# Delivery is the same GitOps hot-reload lane as the Mythra behavior modules:
# flag definitions are committed JSON -> ConfigMap -> kubelet mount refresh ->
# flagd's fsnotify sync reloads the flag set while feature-flags-notify
# (below) fans the new epoch out to every subscribed client, which
# re-evaluates over OFREP. No pod restart, no reloader annotation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagd
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: flagd
    app.kubernetes.io/part-of: guardian
    app.kubernetes.io/component: feature-flags
    guardian.dev/stage: prod
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flagd
      app.kubernetes.io/part-of: guardian
      guardian.dev/stage: prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flagd
        app.kubernetes.io/part-of: guardian
        app.kubernetes.io/component: feature-flags
        guardian.dev/stage: prod
    spec:
      automountServiceAccountToken: false
      # Never inject docker-link service env vars: the Service is named
      # flagd, so kubelet would set FLAGD_PORT=tcp://... — and flagd's viper
      # config reads FLAGD_* env as its own flags, failing to parse the URL
      # and binding the evaluation listener to a random port.
      enableServiceLinks: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: flagd
              app.kubernetes.io/part-of: guardian
              guardian.dev/stage: prod
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flagd
          image: ghcr.io/open-feature/flagd:v0.16.1@sha256:9525b3c2916183810f93f0a72774c1dfad48d1ae22852c753719c46db80af5e7
          imagePullPolicy: IfNotPresent
          args:
            - start
            # fsnotify pinned explicitly: the bare `file` provider would pick
            # it by autodetecting Kubernetes, but the ConfigMap symlink-swap
            # reload is the load-bearing mechanism here, not an optimization.
            - --sources
            - '[{"uri":"/etc/flagd/flags.json","provider":"fsnotify"}]'
            # Ports pinned as args: CLI beats any environment noise.
            - --port=8013
            - --management-port=8014
            - --ofrep-port=8016
            - --log-format=json
          ports:
            - name: evaluation
              containerPort: 8013
              protocol: TCP
            - name: management
              containerPort: 8014
              protocol: TCP
            - name: ofrep
              containerPort: 8016
              protocol: TCP
          readinessProbe:
            # 412 until the first flag sync lands: a pod never takes traffic
            # with an empty flag store.
            httpGet:
              path: /readyz
              port: management
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: management
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Never subPath: kubelet does not refresh subPath mounts, which
            # would silently freeze the flag lane.
            - name: flags
              mountPath: /etc/flagd
              readOnly: true
      volumes:
        - name: flags
          configMap:
            name: guardian-flags
---
apiVersion: v1
kind: Service
metadata:
  name: flagd
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: flagd
    app.kubernetes.io/part-of: guardian
    app.kubernetes.io/component: feature-flags
    guardian.dev/stage: prod
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flagd
    app.kubernetes.io/part-of: guardian
    guardian.dev/stage: prod
  ports:
    - name: management
      port: 8014
      targetPort: management
      protocol: TCP
    - name: ofrep
      port: 8016
      targetPort: ofrep
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: flagd
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: flagd
    app.kubernetes.io/part-of: guardian
    guardian.dev/stage: prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flagd
      app.kubernetes.io/part-of: guardian
      guardian.dev/stage: prod
---
# feature-flags-notify: the change-notification half of the /features
# contract. Serves a read-only SSE stream of the flag-set epoch (content
# hash of flags.json) at /features/events; clients re-evaluate through
# OFREP on a change. It watches the same guardian-flags ConfigMap flagd
# syncs from, so both halves observe one source of truth.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-flags-notify
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: feature-flags-notify
    app.kubernetes.io/part-of: guardian
    app.kubernetes.io/component: feature-flags
    guardian.dev/stage: prod
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: feature-flags-notify
      app.kubernetes.io/part-of: guardian
      guardian.dev/stage: prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: feature-flags-notify
        app.kubernetes.io/part-of: guardian
        app.kubernetes.io/component: feature-flags
        guardian.dev/stage: prod
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: feature-flags-notify
              app.kubernetes.io/part-of: guardian
              guardian.dev/stage: prod
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notify
          image: ghcr.io/guardian-intelligence/feature-flags-notify:edge@sha256:111e28e95e30c0e606e6f9dca11089f767ceb291001405ed95a70c698edc5bf6 # {"$imagepolicy": "guardian-imageops:feature-flags-notify"}
          imagePullPolicy: IfNotPresent
          env:
            - name: NOTIFY_FLAGS_PATH
              value: /etc/flags/flags.json
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            # 412 until the first successful hash of the flag file: a pod
            # that cannot see the flag set must not hold subscriptions.
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
              ephemeral-storage: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Never subPath: kubelet does not refresh subPath mounts, which
            # would silently freeze the epoch.
            - name: flags
              mountPath: /etc/flags
              readOnly: true
      volumes:
        - name: flags
          configMap:
            name: guardian-flags
---
apiVersion: v1
kind: Service
metadata:
  name: feature-flags-notify
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: feature-flags-notify
    app.kubernetes.io/part-of: guardian
    app.kubernetes.io/component: feature-flags
    guardian.dev/stage: prod
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: feature-flags-notify
    app.kubernetes.io/part-of: guardian
    guardian.dev/stage: prod
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: feature-flags-notify
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: feature-flags-notify
    app.kubernetes.io/part-of: guardian
    guardian.dev/stage: prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: feature-flags-notify
      app.kubernetes.io/part-of: guardian
      guardian.dev/stage: prod
