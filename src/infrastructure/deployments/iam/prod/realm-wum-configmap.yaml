---
# The Google clientId below is the OAuth client from the wakeupmythra
# Google Cloud project; its authorized redirect URI must be exactly
# https://auth.wakeupmythra.com/realms/wakeupmythra.com/broker/google/endpoint.
# trustEmail is deliberate: Google only asserts addresses it has verified,
# which lets the email_verified admission gate work without realm SMTP.
# Account linking still fails closed — duplicateEmailsAllowed is off and
# first broker login is create-if-unique.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-wum-identity-providers
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: guardian
    guardian.dev/product: mythra
    guardian.dev/stage: prod
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  google.json: |
    {
      "alias": "google",
      "displayName": "Google",
      "providerId": "google",
      "enabled": true,
      "trustEmail": true,
      "storeToken": false,
      "linkOnly": false,
      "firstBrokerLoginFlowAlias": "broker-create-user-only",
      "config": {
        "clientId": "735717368936-3k8p97q1qoj85kcgnqr7incqc7ikaq3i.apps.googleusercontent.com",
        "clientSecret": "${vault.google-client-secret}",
        "defaultScope": "openid email",
        "syncMode": "IMPORT"
      }
    }
