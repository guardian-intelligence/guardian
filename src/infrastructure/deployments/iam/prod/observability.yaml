# Keycloak metrics scrape (management port) + the stage's IAM SLO alerts.
# The scrape Service selects labels BOTH Flagger colors share, so primary
# and canary pods are scraped whichever is serving.
apiVersion: v1
kind: Service
metadata:
  name: keycloak-metrics
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: guardian
    guardian.dev/stage: prod
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: iam
  ports:
    - name: management
      port: 9000
      targetPort: 9000
      protocol: TCP
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: keycloak
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: guardian
    guardian.dev/stage: prod
spec:
  namespaceSelector:
    matchNames:
      - tenant-guardian-prod
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/component: metrics
  endpoints:
    - port: management
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: guardian-sign-in
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: guardian-sign-in
    app.kubernetes.io/part-of: guardian
    guardian.dev/stage: prod
spec:
  groups:
    - name: guardian-sign-in-prod.rules
      interval: 30s
      rules:
        # Sign-in health is measured at the funnel: Keycloak user event
        # counters over every login attempt. With no synthetic traffic floor
        # an absence of logins is not a signal, so only the failure ratio
        # pages.
        - alert: GuardianSignInFailing
          expr: |
            (
              sum(increase(keycloak_user_events_total{namespace="tenant-guardian-prod",realm="guardianintelligence.org",event="login",error!=""}[10m]))
              /
              sum(increase(keycloak_user_events_total{namespace="tenant-guardian-prod",realm="guardianintelligence.org",event="login"}[10m]))
            ) > 0.5
            and
            sum(increase(keycloak_user_events_total{namespace="tenant-guardian-prod",realm="guardianintelligence.org",event="login"}[10m])) >= 4
          for: 3m
          labels:
            severity: critical
            guardian_stage: prod
            exported_instance: prod/sign-in
          annotations:
            summary: "Most sign-in attempts are failing in prod"
            description: "More than half of the login attempts through the Guardian realm in the last 10 minutes failed (minimum 4 attempts). Split keycloak_user_events_total{event=\"login\",error!=\"\"} by idp and error to localize: idp=\"github\" points at the broker or GitHub, no idp points at the realm or its database."
        - alert: KeycloakScrapeDown
          expr: up{namespace="tenant-guardian-prod",job="keycloak-metrics"} == 0
          for: 5m
          labels:
            severity: warning
            guardian_stage: prod
          annotations:
            summary: "Keycloak metrics scrape is down in prod"
            description: "vmagent cannot scrape the Keycloak management endpoint."
---
# vmagent scrapes the management port from cozy-monitoring.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-vmagent-to-keycloak-metrics
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: guardian
    guardian.dev/stage: prod
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - keycloak
          - keycloak-primary
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: vmagent
            k8s:io.kubernetes.pod.namespace: cozy-monitoring
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
