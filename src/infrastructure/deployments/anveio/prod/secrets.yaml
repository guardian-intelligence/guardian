# The anveio.com Cloudflare Origin CA certificate (apex + wildcard), minted
# at zone onboarding and stored in OpenBao; the Ingress tls block serves it
# to the edge's origin fetches. Rotation is a kv write + ESO refresh — the
# ingress controller watches the Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: anveio-origin-tls
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: anveio-cal
    app.kubernetes.io/part-of: guardian
    guardian.dev/product: anveio
    guardian.dev/stage: prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: iam-prod-openbao
  target:
    name: anveio-origin-tls
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
      engineVersion: v2
  data:
    - secretKey: tls.crt
      remoteRef:
        key: guardian/guardian-mgmt/tenant-guardian-prod/anveio/origin-tls
        property: tls.crt
    - secretKey: tls.key
      remoteRef:
        key: guardian/guardian-mgmt/tenant-guardian-prod/anveio/origin-tls
        property: tls.key
