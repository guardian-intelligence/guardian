# Alerts on what users experienced, not on what the server saw: the metric
# is analytics-ingest's per-event-name counter over the browser-reported
# privatecut.link_failed events, so it fires even when the failure is the BFF
# being unreachable. The @pt:...@ token is rendered to a Pacific wall-clock
# time by alert-relay (renderTimeTokens); vmalert itself cannot format a
# zoned timestamp.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: privatecut-web
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: privatecut-web
    app.kubernetes.io/part-of: guardian
    guardian.dev/product: privatecut
    guardian.dev/stage: prod
spec:
  groups:
    - name: privatecut-web.rules
      interval: 30s
      rules:
        - alert: PrivateCutXLinkImportFailures
          expr: >-
            sum(increase(analytics_ingest_events_by_name_total{site="rumi.engineering",event_name="privatecut.link_failed"}[15m]))
            >= 3
          labels:
            severity: warning
            guardian_stage: prod
          annotations:
            summary: "Elevated X-link import failure rate on rumi.engineering"
            description: >-
              Elevated X URL resolve error rates since @pt:{{ $activeAt.Unix }}@
              — {{ printf "%.0f" $value }} failed X-link imports in the last 15m
              on rumi.engineering. Each privatecut.link_failed event in
              guardian_analytics.events carries props.code and a trace_id; join
              trace_id to guardian_analytics.otel_traces (ServiceName
              privatecut-web) for the resolve → syndication spans and the serving
              image in ResourceAttributes.
        # Encodes run entirely in the visitor's browser, so their failures
        # exist only as beacon events: encode_failed when the engine reports
        # one (failed, stalled, worker-lost), encode_abandoned when a page
        # died or was left mid-encode and the next load reported it. Traffic
        # is low enough that two in an hour is a pattern, not noise.
        - alert: PrivateCutEncodeFailures
          expr: >-
            sum(increase(analytics_ingest_events_by_name_total{site="rumi.engineering",event_name=~"privatecut.encode_failed|privatecut.encode_abandoned"}[1h]))
            >= 2
          labels:
            severity: warning
            guardian_stage: prod
          annotations:
            summary: "Clip encodes failing on rumi.engineering"
            description: >-
              Encodes failing in visitors' browsers since @pt:{{ $activeAt.Unix }}@
              — {{ printf "%.0f" $value }} failed or abandoned encodes in the
              last hour on rumi.engineering. In guardian_analytics.events,
              privatecut.encode_failed carries props.kind (failed, stalled,
              worker-lost), props.stage, props["error.type"] and
              props.pass_trail; privatecut.encode_abandoned carries
              props.reason (page_lost = the tab crashed, page_left = the
              person left mid-encode) and props.context_lost. Group by
              trace_id to read one encode's started → pass → outcome story,
              and check privatecut.gpu_context_lost for GPU-process crashes.
