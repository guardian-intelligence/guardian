# Steady-state browser canary for privatecut: the visual-harness journey suite
# runs against the production site every 30 minutes, failing on visual drift,
# a critical element dropping below the fold, a three-minute/quality-warning
# regression, or a WebM-input MP4/WebM export failure. Baselines ship inside
# the image (journeys/** is part of the image sources), so the comparison and
# the bytes it compares against move together and a refresh is an ordinary
# reviewed PR.
#
# It runs against https://rumi.engineering, not an in-cluster Service: the
# thing customers see includes the edge, so a regression introduced by cache
# rules or edge policy has to be able to fail this.
#
# Deliberately no --update-snapshots: a missing baseline is a finding here,
# not a bootstrap convenience. Self-blessing in prod would let a form factor
# silently lose its baseline and report green forever.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: privatecut-visual-canary
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: privatecut-visual-canary
    app.kubernetes.io/part-of: guardian
    guardian.dev/stage: prod
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # The suite walks every form factor at a fixed animation timestamp;
      # 2m of harness timeout plus browser start and image pull.
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: privatecut-visual-canary
            app.kubernetes.io/part-of: guardian
            guardian.dev/stage: prod
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 12345
            runAsGroup: 12345
            fsGroup: 12345
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: visual
              image: ghcr.io/guardian-intelligence/visual-harness:edge@sha256:f1ca41f5fc5e9c8d9056359b284377709680879cabc8d41dd2106c00f56c36f0 # {"$imagepolicy": "guardian-imageops:visual-harness"}
              imagePullPolicy: IfNotPresent
              env:
                - name: VISUAL_TARGET_URL
                  value: https://rumi.engineering
                - name: VISUAL_TARGET
                  value: privatecut
                - name: VISUAL_OUTPUT_DIR
                  value: /tmp/visual-harness-output
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            # Chromium's sandbox, the harness output dir, and the image's
            # HOME=/tmp/home all land here; the root filesystem stays
            # read-only.
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: privatecut-visual-canary
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: privatecut-visual-canary
    app.kubernetes.io/part-of: guardian
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: privatecut-visual-canary
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # The canary reaches privatecut the way a customer does: out to the
    # Cloudflare edge, never to the in-cluster Service.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: privatecut-visual-canary
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: privatecut-visual-canary
    app.kubernetes.io/part-of: guardian
    guardian.dev/stage: prod
spec:
  groups:
    - name: privatecut-visual-canary-prod.rules
      interval: 60s
      rules:
        # A failed run is a real finding: either privatecut drifted from its
        # baselines, a critical element fell below the fold, or the canary
        # could not run at all (canaries.md principle 4 — a canary that
        # can't run is a finding, not a skip). This is also what covers a
        # canary that has never succeeded, which the staleness rule below
        # structurally cannot see (the vector(0) fallback: a failure with
        # no success on record fires). Keyed to the LATEST terminal run,
        # not the existence of a failed Job: failedJobsHistoryLimit keeps
        # the last failed Job object around until the next failure, so an
        # existence check can never resolve on success and one flake pages
        # for days.
        - alert: PrivatecutVisualCanaryFailing
          expr: |
            max(kube_job_status_start_time{namespace="tenant-guardian-prod",job_name=~"privatecut-visual-canary-.*"}
                and on(namespace, job_name) kube_job_status_failed{namespace="tenant-guardian-prod",job_name=~"privatecut-visual-canary-.*"} > 0)
            >=
            (max(kube_job_status_start_time{namespace="tenant-guardian-prod",job_name=~"privatecut-visual-canary-.*"}
                and on(namespace, job_name) kube_job_status_succeeded{namespace="tenant-guardian-prod",job_name=~"privatecut-visual-canary-.*"} > 0)
             or vector(0))
          for: 5m
          labels:
            severity: warning
            guardian_stage: prod
            exported_instance: prod/privatecut-visual-canary
          annotations:
            summary: "privatecut visual canary is failing"
            description: "A privatecut-visual-canary run failed against https://rumi.engineering: visual drift, a critical element below the fold, WebM input or MP4/WebM export failure, or the harness failing to start. Pull the pod logs for the failing journey; refresh baselines only after confirming visual changes were intended."
        # Fires only once the canary has succeeded at least once: with no
        # successful run the series does not exist and the expression is
        # empty, so standing this up cannot page before first success. 95m
        # tolerates two missed 30m cycles plus the run deadline and scrape
        # lag.
        - alert: PrivatecutVisualCanaryStale
          expr: |
            time() - max(kube_cronjob_status_last_successful_time{namespace="tenant-guardian-prod",cronjob="privatecut-visual-canary"}) > 5700
          for: 5m
          labels:
            severity: warning
            guardian_stage: prod
            exported_instance: prod/privatecut-visual-canary
          annotations:
            summary: "privatecut visual canary has not succeeded recently"
            description: "No successful privatecut-visual-canary run in over 95 minutes (two missed 30m cycles). The CronJob may be suspended, unschedulable, or failing before it can report; check the Job history in tenant-guardian-prod."
