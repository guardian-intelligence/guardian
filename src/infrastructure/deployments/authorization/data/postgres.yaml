apiVersion: apps.cozystack.io/v1alpha1
kind: Postgres
metadata:
  name: spicedb
  namespace: tenant-guardian-prod
spec:
  replicas: 3
  # 40Gi: the thumper's write load produces several GiB of WAL per day, and
  # CNPG refuses to start an instance whose volume has no room for WAL, so
  # headroom above the slot cap is what keeps a degraded cluster startable.
  size: 40Gi
  storageClass: replicated-encrypted
  external: false
  version: v18
  resources:
    cpu: 2
    memory: 2Gi
  # Carries the operational stamp uniform across Guardian Postgres instances
  # (see deployments/iam/prod/postgres.yaml): slot WAL retention capped at 4GB
  # so a replica on an unreachable node invalidates its slot instead of
  # filling the volume of every surviving instance.
  postgresql:
    parameters:
      max_connections: 100
      shared_buffers: 512MB
      effective_cache_size: 1536MB
      statement_timeout: 120s
      idle_in_transaction_session_timeout: 300s
      lock_timeout: 10s
      archive_timeout: 300s
      max_slot_wal_keep_size: 4GB
      track_commit_timestamp: "on"
  users:
    spicedb: {}
  databases:
    spicedb:
      roles:
        admin:
          - spicedb
  quorum:
    minSyncReplicas: 1
    maxSyncReplicas: 2
  backup:
    enabled: true
    useSystemBucket: true
---
apiVersion: backups.cozystack.io/v1alpha1
kind: Plan
metadata:
  name: spicedb-postgres-nightly
  namespace: tenant-guardian-prod
spec:
  applicationRef:
    apiGroup: apps.cozystack.io
    kind: Postgres
    name: spicedb
  backupClassName: guardian-r2
  schedule:
    type: cron
    cron: "0 4 * * *"
---
apiVersion: backups.cozystack.io/v1alpha1
kind: BackupJob
metadata:
  name: spicedb-postgres-archive-activation
  namespace: tenant-guardian-prod
spec:
  applicationRef:
    apiGroup: apps.cozystack.io
    kind: Postgres
    name: spicedb
  backupClassName: cozy-default
---
apiVersion: backups.cozystack.io/v1alpha1
kind: BackupJob
metadata:
  name: spicedb-postgres-restore-baseline-20260718
  namespace: tenant-guardian-prod
spec:
  applicationRef:
    apiGroup: apps.cozystack.io
    kind: Postgres
    name: spicedb
  backupClassName: cozy-default
---
apiVersion: backups.cozystack.io/v1alpha1
