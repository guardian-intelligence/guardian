# In-cluster-born Directus credentials: generated once by ESO, never in
# OpenBao (regenerate-never-restore class per docs/secrets.md). Rotation is
# a new guardian.dev/rotation + force-sync stamp.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: directus-app-secret
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: directus
    app.kubernetes.io/part-of: guardian
spec:
  length: 48
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: directus-app-secret
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: directus
    app.kubernetes.io/part-of: guardian
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: directus-app-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: directus-app-secret
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: directus-admin-credential
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: directus
    app.kubernetes.io/part-of: guardian
spec:
  length: 32
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: directus-admin-credential
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: directus
    app.kubernetes.io/part-of: guardian
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: directus-admin-credential
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: directus-admin-credential
