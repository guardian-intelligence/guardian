# Directus application config as code. Directus stores collections,
# permissions, and field metadata as rows in its own database, so this
# reconciler Job applies the desired shape through the admin API the same way
# keycloak-realm-reconciler does for the realm: the admin credential is
# mounted by the cluster, no operator ever reads it, and a config change is a
# PR. Bump checksum/provision-script (sha256 of provision.mjs below) whenever
# the script changes — Flux force-recreates the Job when its template moves.
apiVersion: v1
kind: ConfigMap
metadata:
  name: directus-provisioner-script
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: directus-provisioner
    app.kubernetes.io/part-of: guardian
    guardian.dev/product: company-site
    guardian.dev/stage: prod
  annotations:
    # The script's JS template literals are ${...} — Flux post-build
    # substitution must never touch this resource or the build fails.
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  provision.mjs: |
    // Idempotent Directus provisioning: the letters collection, the hidden
    // kind field, the draft/published status field, and the anonymous read
    // grant the public site depends on.
    const BASE = process.env.DIRECTUS_URL;

    const login = await fetch(`${BASE}/auth/login`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        email: process.env.DIRECTUS_EMAIL,
        password: process.env.DIRECTUS_PASSWORD,
      }),
    });
    if (!login.ok) throw new Error(`login failed: ${login.status}`);
    const token = (await login.json()).data.access_token;

    async function api(path, init) {
      const res = await fetch(`${BASE}${path}`, {
        ...init,
        headers: {
          authorization: `Bearer ${token}`,
          "content-type": "application/json",
          ...init?.headers,
        },
      });
      if (!res.ok) {
        throw new Error(`${init?.method ?? "GET"} ${path}: ${res.status} ${await res.text()}`);
      }
      return res;
    }
    // Reads return null for something that does not exist. Directus answers
    // a missing collection or field with 403 FORBIDDEN even for admin, so
    // that counts as absent alongside 404.
    const get = async (path) => {
      const res = await fetch(`${BASE}${path}`, { headers: { authorization: `Bearer ${token}` } });
      if (res.status === 404 || res.status === 403) return null;
      if (!res.ok) throw new Error(`GET ${path}: ${res.status} ${await res.text()}`);
      return (await res.json()).data;
    };

    const FIELDS = [
      "slug", "title", "publishedAt", "flare", "kind", "status",
      "author", "authorTitle", "description", "note", "body",
    ];
    // summary was the publish gate before status. It stays anonymously
    // readable only until every site pod runs an image that no longer
    // requests it; the follow-up that deletes the field drops it here.
    const PUBLIC_FIELDS = [...FIELDS, "summary"];

    // Directus's standard status field. Created nullable with no default so
    // existing rows arrive null and the backfill below can classify them;
    // new letters then default to draft.
    const STATUS_FIELD = {
      field: "status",
      type: "string",
      schema: {},
      meta: {
        interface: "select-dropdown",
        display: "labels",
        width: "half",
        options: {
          choices: [
            { text: "Draft", value: "draft" },
            { text: "Published", value: "published" },
          ],
        },
        note: "Only published letters reach the site.",
      },
    };

    // Collection: create when absent (fresh database); the field list must
    // stay in sync with letters.server.ts and letter-schema.ts.
    const collection = await get("/collections/letters");
    if (!collection) {
      await api("/collections", {
        method: "POST",
        body: JSON.stringify({
          collection: "letters",
          meta: {
            icon: "mail",
            note: "Company-site letters. The public site serves published letters from here at request time.",
          },
          schema: {},
          fields: [
            { field: "slug", type: "string", schema: { is_primary_key: true, length: 128 }, meta: { interface: "input", readonly: false } },
            { field: "title", type: "string", schema: {}, meta: { interface: "input" } },
            { field: "publishedAt", type: "date", schema: {}, meta: {} },
            { field: "flare", type: "string", schema: {}, meta: { interface: "input", note: "Must be a substring of title; the OG card highlights it." } },
            { field: "kind", type: "string", schema: { default_value: "dispatch" }, meta: { hidden: true } },
            STATUS_FIELD,
            { field: "author", type: "string", schema: {}, meta: { interface: "input", note: "Provenance only, never rendered." } },
            { field: "authorTitle", type: "string", schema: {}, meta: { interface: "input", note: "Provenance only, never rendered." } },
            { field: "description", type: "text", schema: {}, meta: { interface: "input-multiline", note: "SEO/share description. Empty = the letter's opening words." } },
            { field: "note", type: "text", schema: {}, meta: { interface: "input-multiline", note: "Author's longer context, JSON-LD only." } },
            { field: "body", type: "text", schema: {}, meta: { interface: "input-rich-text-md" } },
          ],
        }),
      });
      console.error("created collection letters");
    }

    // kind is a rendering treatment reserved for dear-shovon, not an
    // authoring decision: hidden in the form, every new letter a dispatch.
    await api("/fields/letters/kind", {
      method: "PATCH",
      body: JSON.stringify({
        meta: { hidden: true },
        schema: { default_value: "dispatch" },
      }),
    });
    console.error("kind field: hidden, default dispatch");

    if (!(await get("/fields/letters/status"))) {
      await api("/fields/letters", { method: "POST", body: JSON.stringify(STATUS_FIELD) });
      console.error("created status field");
    }
    // Classify letters that predate status: a summary meant published. A
    // summary that said more than the title was share text, so it becomes
    // the description when the letter has none. Only rows with a null status
    // are touched, so reruns and Studio edits are left alone.
    const hasSummary = Boolean(await get("/fields/letters/summary"));
    const unclassified =
      (await get(
        `/items/letters?limit=-1&filter[status][_null]=true&fields=slug,title,description${hasSummary ? ",summary" : ""}`,
      )) ?? [];
    for (const item of unclassified) {
      const summary = item.summary?.trim() ?? "";
      const patch = { status: summary ? "published" : "draft" };
      if (summary && summary !== item.title && !item.description?.trim()) {
        patch.description = summary;
      }
      await api(`/items/letters/${encodeURIComponent(item.slug)}`, {
        method: "PATCH",
        body: JSON.stringify(patch),
      });
      console.error(`classified ${item.slug}: ${JSON.stringify(patch)}`);
    }
    await api("/fields/letters/status", {
      method: "PATCH",
      body: JSON.stringify({ meta: STATUS_FIELD.meta, schema: { default_value: "draft" } }),
    });
    if (hasSummary) {
      await api("/fields/letters/summary", {
        method: "PATCH",
        body: JSON.stringify({ meta: { hidden: true, note: "Retired; status is the publish gate." } }),
      });
    }

    // Anonymous read on published letters only — the site's runtime read
    // path. The same grant is what cms.guardianintelligence.org exposes to
    // the world: exactly the content already public on /letters. Drafts
    // never pass the filter. The policy id is Directus's
    // well-known PUBLIC_POLICY_ID constant (migration 20240806A), stable
    // across every install.
    const PUBLIC_POLICY_ID = "abf8a154-5b1c-4a46-ac9c-7300570f4f17";
    const publicPolicy = await get(`/policies/${PUBLIC_POLICY_ID}?fields=id`);
    if (!publicPolicy) throw new Error("system Public policy not found");
    const existing = await get(
      `/permissions?filter[policy][_eq]=${publicPolicy.id}&filter[collection][_eq]=letters&filter[action][_eq]=read&fields=id`,
    );
    const grant = {
      fields: hasSummary ? PUBLIC_FIELDS : FIELDS,
      permissions: { _and: [{ status: { _eq: "published" } }] },
    };
    if (existing?.[0]) {
      await api(`/permissions/${existing[0].id}`, { method: "PATCH", body: JSON.stringify(grant) });
      console.error(`public read permission reconciled: ${existing[0].id}`);
    } else {
      await api("/permissions", {
        method: "POST",
        body: JSON.stringify({ policy: publicPolicy.id, collection: "letters", action: "read", ...grant }),
      });
      console.error("created public read permission");
    }

    // Verify as the anonymous role before declaring success.
    const anon = await fetch(`${BASE}/items/letters?fields=slug,status`);
    if (!anon.ok) throw new Error(`anonymous read failed: ${anon.status}`);
    const items = (await anon.json()).data ?? [];
    if (items.some((item) => item.status !== "published")) {
      throw new Error("anonymous read returned a draft — permission filter broken");
    }
    console.error(`anonymous read ok: ${items.map((item) => item.slug).join(", ")}`);
---
apiVersion: batch/v1
kind: Job
metadata:
  name: directus-provisioner
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: directus-provisioner
    app.kubernetes.io/part-of: guardian
    guardian.dev/product: company-site
    guardian.dev/stage: prod
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  backoffLimit: 20
  activeDeadlineSeconds: 600
  template:
    metadata:
      annotations:
        checksum/provision-script: 35caf5d99c5aafaa8295b61d08922a13dd8e72b5d75f1d8c00c95ac35a5d07f5
      labels:
        app.kubernetes.io/name: directus-provisioner
        app.kubernetes.io/part-of: guardian
        guardian.dev/product: company-site
        guardian.dev/stage: prod
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision
          # Same pin as the directus Deployment (directus.yaml); the image
          # is only borrowed for its node runtime.
          image: docker.io/directus/directus:11.17.4@sha256:eb326f679ae847c0a776f93b972761dc2ebe84980e0b9d274a6bc31cd62809f7
          command: ["node", "/provision/provision.mjs"]
          env:
            - name: DIRECTUS_URL
              value: http://directus.tenant-guardian-prod.svc
            - name: DIRECTUS_EMAIL
              value: admin@guardianintelligence.org
            - name: DIRECTUS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: directus-admin-credential
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /provision
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: directus-provisioner-script
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: directus-provisioner
  namespace: tenant-guardian-prod
  labels:
    app.kubernetes.io/name: directus-provisioner
    app.kubernetes.io/part-of: guardian
    guardian.dev/stage: prod
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: directus-provisioner
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: directus
      toPorts:
        - ports:
            - port: "8055"
              protocol: TCP
