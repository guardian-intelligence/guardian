# Wake Up Mythra's game manifest: the vocabulary the chunkies host reads
# at boot (GAME_MANIFEST_FILE). Kind numbers mirror wum.go and the park
# module; action names stay aligned with client/src/actions.ts. Held in
# lockstep with wum.go by TestManifestMatchesVocabulary.

# Staged when a player session disconnects (EvLeave).
depart 2

# Bounded metric/span names for player intent kinds.
action 1 join
action 3 check_in
action 4 move_to
action 8 boost

# Bounded names for the sim's reject codes.
reject 1 encoding
reject 2 present
reject 3 absent
reject 4 full
reject 5 checked_in
reject 6 kind
reject 7 epoch
reject 8 target
reject 9 terrain
reject 10 noop

# Journal payload eras (dies with the Postgres journal): rows of these
# kinds whose payload is exactly this long predate the v5 flag day and
# carry the dog id as an 8-byte prefix.
legacy_actor 1 8
legacy_actor 2 8
legacy_actor 3 8
legacy_actor 4 10
legacy_actor 8 9

# Consequential facts — kinds whose effects must survive world loss:
# routed via the control-plane ledger and re-injected exactly-once by
# id on a lineage rewind, never carried in checkpoint state. WUM
# declares none yet: purchases/entitlements/prizes are ruled
# control-plane-lane and gain `consequential <kind>` lines here the day
# their kinds exist.
